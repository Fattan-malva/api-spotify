<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spotify Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      width: 100%;
      height: 100%
    }

    body {
      overflow: hidden;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg {
      position: fixed;
      inset: -80px;
      z-index: 0;
      background-size: cover;
      background-position: center;
      filter: blur(80px) brightness(.35) saturate(1.3);
      transform: scale(1.15);
      transition: background-image .6s ease
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, .15) 0%, rgba(0, 0, 0, .65) 100%)
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(1120px, calc(100% - 48px));
      height: min(500px, calc(100vh - 48px));
      display: grid;
      grid-template-columns: min(46vw, 500px) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) 166px;
      align-content: center;
      align-items: stretch;
      justify-content: center;
      column-gap: clamp(30px, 4vw, 64px);
      padding: 0;
      margin: auto
    }

    .artwork {
      grid-column: 1;
      grid-row: 1 / span 2;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      justify-self: stretch;
      align-self: stretch;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .6);
      background: rgba(255, 255, 255, .06)
    }

    .artwork img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity .4s ease
    }

    .artwork img.loaded {
      opacity: 1
    }

    #loadingWrap {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 5
    }

    .info {
      grid-column: 2;
      grid-row: 1;
      text-align: left;
      max-width: none;
      width: 100%;
      min-width: 0;
      align-self: start;
      padding-top: 4px;
      overflow: hidden
    }

    .info h1 {
      color: #fff;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 700;
      white-space: nowrap;
      display: inline-block;
      padding-left: 100%;
      animation: scrollText 12s linear infinite
    }

    @keyframes scrollText {
      0% {
        transform: translateX(0)
      }

      100% {
        transform: translateX(-100%)
      }
    }

    .info h2 {
      color: rgba(255, 255, 255, .7);
      font-size: clamp(14px, 2vw, 18px);
      margin-top: 6px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .info .stats {
      color: rgba(255, 255, 255, .45);
      font-size: 13px;
      margin-top: 16px;
      display: flex;
      gap: 18px;
      justify-content: flex-start;
      flex-wrap: wrap
    }

    .player {
      grid-column: 2;
      grid-row: 2;
      width: 100%;
      height: 166px;
      max-width: none;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .5);
      align-self: end;
      background: rgba(0, 0, 0, .2)
    }

    .player iframe {
      width: 100%;
      height: 166px;
      border: 0;
      display: block;
      background: #181818
    }

    @media (max-width:760px) {
      .content {
        width: 100%;
        height: auto;
        min-height: 100%;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        align-content: center;
        justify-items: center;
        align-items: center;
        row-gap: 28px;
        padding: 24px 18px;
        overflow: auto
      }

      .artwork {
        grid-column: 1;
        grid-row: 1;
        width: min(78vw, 360px);
        height: auto;
        aspect-ratio: 1;
        justify-self: center;
        align-self: auto
      }

      .info {
        grid-column: 1;
        grid-row: 2;
        text-align: center;
        width: 100%;
        padding-top: 0;
        align-self: auto
      }

      .info .stats {
        justify-content: center
      }

      .player {
        grid-column: 1;
        grid-row: 3;
        width: 100%;
        height: 166px;
        align-self: auto
      }
    }

    #controls {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 20;
      align-items: center;
      gap: 14px;
      background: rgba(0, 0, 0, .72);
      border: 1px solid rgba(255, 255, 255, .12);
      padding: 12px 22px;
      border-radius: 50px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, .5);
      backdrop-filter: blur(8px)
    }

    #controls .ctl-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #fff;
      background: rgba(255, 255, 255, .12);
      transition: background .2s;
      display: flex;
      align-items: center;
      justify-content: center
    }

    #controls .ctl-btn:hover {
      background: rgba(255, 255, 255, .25)
    }

    #controls .ctl-btn.main {
      background: #1db954
    }

    .loading {
      color: rgba(255, 255, 255, .8);
      font-size: 14px;
      letter-spacing: .5px
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .15);
      border-top-color: #1db954;
      animation: spin .8s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .click-hint {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .65);
      color: #fff;
      cursor: pointer;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: .5px
    }

    .click-hint .play-ico {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #1db954;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 12px 40px rgba(29, 185, 84, .5)
    }

    .click-hint .play-ico::after {
      content: "";
      display: block;
      width: 0;
      height: 0;
      border-left: 26px solid #fff;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      margin-left: 6px
    }

    .error {
      color: #fff;
      font-size: 16px;
      text-align: center;
      max-width: 480px;
      padding: 20px
    }

    .error small {
      display: block;
      margin-top: 10px;
      color: rgba(255, 255, 255, .5);
      font-size: 12px
    }

    #status {
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 100;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, .7);
      color: rgba(255, 255, 255, .55);
      font-size: 10px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease
    }

    #status.show {
      opacity: 1
    }
  </style>
</head>

<body>
  <div class="bg" id="bg"></div>
  <div class="bg-overlay"></div>
  <div class="content" id="content">
    <div id="loadingWrap" style="display:flex;flex-direction:column;align-items:center;gap:16px">
      <div class="spinner"></div>
      <div class="loading">Loading track...</div>
    </div>
  </div>
  <div id="controls">
    <button class="ctl-btn" id="btnReplay" title="Replay">&#9198;</button>
    <button class="ctl-btn" id="btnPrev" title="Pause">&#9208;</button>
    <button class="ctl-btn main" id="btnPlay" title="Play">&#9654;</button>
    <button class="ctl-btn" id="btnNext" title="Next">&#9197;</button>
  </div>
  <div id="status"></div>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var trackId = params.get('trackId');
      var statusEl = document.getElementById('status');

      var pendingVolume = 0.9;
      try {
        var v = parseFloat(params.get('volume'));
        if (isFinite(v)) { if (v > 1) v /= 100; pendingVolume = Math.max(0, Math.min(1, v)); }
      } catch (e) { }

      // Support initialTrack dari host (VB mengirim ?title= & ?track= json) — biar thumbnail langsung muncul
      var initialTrack = null;
      try {
        var tTitle = params.get('title') || params.get('trackTitle');
        var tArtist = params.get('artist') || params.get('trackArtist');
        var tThumb = params.get('thumbnail') || params.get('thumb') || params.get('cover');
        var tDur = params.get('duration');
        var tDurMs = params.get('durationMs') || params.get('duration_ms');
        var tAlbum = params.get('album');
        var tJson = params.get('track');
        if (tJson) {
          try { initialTrack = JSON.parse(decodeURIComponent(tJson)); } catch (e) { }
        }
        if (!initialTrack && (tTitle || tArtist || tThumb || tDur)) {
          initialTrack = {
            title: tTitle ? decodeURIComponent(tTitle) : null,
            artist: tArtist ? decodeURIComponent(tArtist) : null,
            thumbnail: tThumb ? decodeURIComponent(tThumb) : null,
            duration: tDur ? decodeURIComponent(tDur) : null,
            durationMs: tDurMs ? parseInt(tDurMs, 10) : 0,
            album: tAlbum ? decodeURIComponent(tAlbum) : null
          };
        }
      } catch (e) { }

      var metaTrack = null;
      var trackDurationMs = initialTrack && initialTrack.durationMs ? initialTrack.durationMs : 0;
      var trackStartedAt = 0, isPlaying = false, endedSent = false, pollingInterval = null;
      var hintEl = null, hintShown = false;
      var embedReady = false, pendingPlay = false;

      function log() { var a = [].slice.call(arguments); a.unshift('[SP]'); console.log.apply(console, a); }
      function setStatus(m) { if (!statusEl) return; statusEl.textContent = m || ''; if (m) { statusEl.classList.add('show'); setTimeout(function () { statusEl.classList.remove('show') }, 2200); } else statusEl.classList.remove('show'); }
      function sendToHost(msg) {
        log('Sending', msg);
        try { if (window.chrome && window.chrome.webview) { window.chrome.webview.postMessage(msg); return; } } catch (e) { }
        try { window.postMessage({ type: msg, trackId: trackId }, '*'); } catch (e) { }
      }
      function notifyVideoEnded() {
        if (endedSent) return;
        endedSent = true; stopPolling(); isPlaying = false;
        sendToHost('videoEnded');
        try { window.dispatchEvent(new CustomEvent('videoEnded', { detail: { trackId: trackId } })); } catch (e) { }
      }
      function showError(msg) {
        var wrap = document.getElementById('loadingWrap'); if (wrap) wrap.style.display = 'none';
        var err = document.createElement('div'); err.className = 'error';
        err.innerHTML = '<strong>' + (msg || 'Failed to load track') + '</strong><small>Check that trackId is valid.</small>';
        document.getElementById('content').appendChild(err);
      }
      function fmtTime(sec) {
        if (!isFinite(sec) || sec < 0) sec = 0;
        sec = Math.floor(sec);
        var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
        if (h) return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        return m + ':' + (s < 10 ? '0' : '') + s;
      }
      function ensureHint() {
        if (hintShown || hintEl) return;
        hintShown = true;
        hintEl = document.createElement('div'); hintEl.className = 'click-hint';
        hintEl.innerHTML = '<div class="play-ico"></div><div>Click to play</div>';
        hintEl.addEventListener('click', function () { playSound(); if (hintEl) { hintEl.remove(); hintEl = null; } });
        document.body.appendChild(hintEl);
      }
      function getEmbedDoc() {
        var iframe = document.getElementById('spWidget');
        try { return iframe && iframe.contentDocument ? iframe.contentDocument : null; } catch (e) { return null; }
      }
      function getEmbedWindow() {
        var iframe = document.getElementById('spWidget');
        try { return iframe && iframe.contentWindow ? iframe.contentWindow : null; } catch (e) { return null; }
      }
      function setEmbedVolume(vol) {
        if (!isFinite(vol)) return;
        if (vol > 1) vol /= 100;
        pendingVolume = Math.max(0, Math.min(1, vol));
        var doc = getEmbedDoc(), win = getEmbedWindow();
        if (doc) {
          try {
            doc.querySelectorAll('audio').forEach(function (a) { try { a.volume = pendingVolume; a.muted = false; } catch (e) { } });
            var inner = doc.querySelectorAll('iframe');
            inner.forEach(function (f) { try { var d = f.contentDocument; if (d) d.querySelectorAll('audio').forEach(function (a) { a.volume = pendingVolume }); } catch (e) { } });
          } catch (e) { }
        }
        if (win) {
          try {
            [{ command: 'setVolume', volume: pendingVolume }, { type: 'setVolume', volume: pendingVolume }].forEach(function (p) {
              try { win.postMessage(p, '*'); } catch (e) { }
            });
          } catch (e) { }
        }
        return true;
      }
      function clickPlayInEmbed() {
        var doc = getEmbedDoc(), win = getEmbedWindow();
        if (doc) {
          try {
            var selectors = ['button[data-testid="play-pause-button"]', 'button[data-testid="play-button"]', '[data-testid="play-pause-button"]', 'button[aria-label="Play"]', '[aria-label="Play"]'];
            for (var i = 0; i < selectors.length; i++) {
              var btn = doc.querySelector(selectors[i]);
              if (btn) {
                var label = (btn.getAttribute('aria-label') || '').toLowerCase();
                if (label.indexOf('pause') !== -1) return true;
                btn.click(); log('Clicked', selectors[i]); return true;
              }
            }
            doc.querySelectorAll('iframe').forEach(function (f) {
              try { var d = f.contentDocument; if (!d) return; selectors.forEach(function (s) { var b = d.querySelector(s); if (b) b.click(); }); } catch (e) { }
            });
          } catch (e) { log('click err', e); }
        }
        if (win) {
          try { [{ command: 'play' }, { type: 'play' }].forEach(function (c) { try { win.postMessage(c, '*'); } catch (e) { } }); } catch (e) { }
          return true;
        }
        return false;
      }

      function render(track) {
        // merge dengan initialTrack biar data sesuai search
        if (initialTrack) {
          if ((!track.durationMs || track.durationMs === 0) && initialTrack.durationMs) track.durationMs = initialTrack.durationMs;
          if (!track.duration || track.duration === '0:00') track.duration = initialTrack.duration;
          if (!track.thumbnail && initialTrack.thumbnail) track.thumbnail = initialTrack.thumbnail;
          if (!track.title && initialTrack.title) track.title = initialTrack.title;
          if (!track.artist && initialTrack.artist) track.artist = initialTrack.artist;
          if (!track.album && initialTrack.album) track.album = initialTrack.album;
        }
        metaTrack = track;
        if (track.durationMs && track.durationMs > 0) trackDurationMs = track.durationMs;
        document.title = (track.title || 'Spotify') + ' - ' + (track.artist || '');
        var wrap = document.getElementById('loadingWrap'); if (wrap) wrap.style.display = 'none';
        var art = track.thumbnail || '';
        if (art) document.getElementById('bg').style.backgroundImage = "url('" + art.replace(/'/g, "\\'") + "')";
        var content = document.getElementById('content');

        var artwork = document.createElement('div'); artwork.className = 'artwork'; artwork.id = 'artwork';
        var img = document.createElement('img'); img.alt = track.title || ''; img.onload = function () { this.classList.add('loaded') }; if (art) img.src = art;
        artwork.appendChild(img);
        content.appendChild(artwork);

        var info = document.createElement('div'); info.className = 'info'; info.id = 'info';
        info.innerHTML = '<h1>' + (track.title || 'Unknown') + '</h1><h2>' + (track.artist || '') + '</h2>';
        var stats = [];
        if (track.duration) stats.push('&#9201; ' + track.duration);
        if (track.album) stats.push(track.album);
        if (track.explicit) stats.push('Explicit');
        if (stats.length) info.innerHTML += '<div class="stats">' + stats.map(function (s) { return '<span>' + s + '</span>' }).join('') + '</div>';
        content.appendChild(info);

        var player = document.createElement('div'); player.className = 'player'; player.id = 'player';
        var iframe = document.createElement('iframe');
        iframe.id = 'spWidget';
        iframe.setAttribute('allow', 'autoplay; encrypted-media; fullscreen; clipboard-write');
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('loading', 'eager');
        iframe.src = '/embed-proxy?trackId=' + encodeURIComponent(track.trackId || trackId);
        player.appendChild(iframe);
        content.appendChild(player);

        log('Embed injected', iframe.src);
        embedReady = false; pendingPlay = false;

        iframe.onload = function () {
          log('Embed loaded');
          embedReady = true;
          setTimeout(function () { setEmbedVolume(pendingVolume); }, 150);
          setTimeout(function () { setEmbedVolume(pendingVolume); }, 600);
          setTimeout(function () { setEmbedVolume(pendingVolume); }, 1500);
          setStatus('ready');
          sendToHost('embed_ready');
          if (pendingPlay) { pendingPlay = false; setTimeout(function () { doPlayEmbed(); }, 250); }
          else {
            // autoplay seperti sebelumnya
            setTimeout(function () { if (!endedSent) doPlayEmbed(); }, 400);
          }
        };
        // fallback hint jika autoplay diblokir
        setTimeout(function () {
          if (!isPlaying) ensureHint();
        }, 3500);
      }

      function doPlayEmbed() {
        setEmbedVolume(pendingVolume);
        clickPlayInEmbed();
        try { document.getElementById('spWidget').focus(); } catch (e) { }
        isPlaying = true; trackStartedAt = Date.now(); endedSent = false;
        startPolling();
        setStatus('playing');
        setTimeout(function () { setEmbedVolume(pendingVolume); }, 300);
      }
      function startPolling() {
        stopPolling();
        if (!trackDurationMs || trackDurationMs <= 0) return;
        log('startPolling durationMs=' + trackDurationMs);
        pollingInterval = setInterval(function () {
          if (!isPlaying || endedSent) return;
          var elapsed = Date.now() - trackStartedAt;
          if (elapsed >= trackDurationMs + 2000) {
            log('polling elapsed ' + elapsed + ' >= ' + (trackDurationMs + 2000) + ' -> videoEnded');
            stopPolling(); notifyVideoEnded();
          }
        }, 1000);
        // safety hard timeout +30s
        setTimeout(function () {
          if (!endedSent && isPlaying) {
            var elapsed = Date.now() - trackStartedAt;
            // jangan trigger kalau masih jauh dari durasi
            if (elapsed < trackDurationMs + 10000) return;
            log('hard safety trigger');
            stopPolling(); notifyVideoEnded();
          }
        }, trackDurationMs + 30000);
      }
      function stopPolling() { if (pollingInterval) { clearInterval(pollingInterval); pollingInterval = null; } }

      // === VB.NET compatible API — sama seperti api-soundcloud ===
      function playSound() { log('[VB] playSound'); endedSent = false; pendingVolume = pendingVolume || 0.9; setEmbedVolume(pendingVolume); if (!embedReady) { pendingPlay = true; log('queue play'); return; } doPlayEmbed(); }
      function pauseSound() {
        log('[VB] pauseSound');
        try {
          var doc = getEmbedDoc();
          if (doc) {
            var btn = doc.querySelector('button[aria-label="Pause"]') || doc.querySelector('[aria-label="Pause"]');
            if (btn) { btn.click(); }
            else { var w = getEmbedWindow(); if (w) w.postMessage({ command: 'pause' }, '*'); }
          }
        } catch (e) { }
        isPlaying = false; stopPolling(); setStatus('paused');
      }
      function replaySound() {
        log('[VB] replaySound -> seek 0 + play');
        endedSent = false; isPlaying = false; trackStartedAt = Date.now();
        var iframe = document.getElementById('spWidget');
        if (iframe) {
          try {
            var win = getEmbedWindow(), doc = getEmbedDoc();
            var seekOk = false;
            if (win) {
              try { win.postMessage({ command: 'seek', position: 0 }, '*'); win.postMessage({ command: 'seekTo', seconds: 0 }, '*'); seekOk = true; } catch (e) { }
            }
            if (doc) {
              try {
                doc.querySelectorAll('input[type="range"]').forEach(function (r) {
                  try { var max = parseFloat(r.max) || 100; if (max > 1) { r.value = '0'; r.dispatchEvent(new Event('input', { bubbles: true })); r.dispatchEvent(new Event('change', { bubbles: true })); seekOk = true; } } catch (e) { }
                });
              } catch (e) { }
            }
            if (seekOk) {
              setTimeout(function () { setEmbedVolume(pendingVolume); doPlayEmbed(); }, 250);
            } else {
              iframe.src = '/embed-proxy?trackId=' + encodeURIComponent(trackId) + '&t=' + Date.now();
              pendingPlay = true; isPlaying = false;
            }
          } catch (e) { try { iframe.src = '/embed-proxy?trackId=' + encodeURIComponent(trackId) + '&t=' + Date.now(); pendingPlay = true; } catch (ee) { } }
        } else { playSound(); }
      }
      function nextSound() { log('[VB] nextSound'); try { sendToHost('nextRequested'); } catch (e) { } replaySound(); }

      document.getElementById('btnPlay').addEventListener('click', playSound);
      document.getElementById('btnPrev').addEventListener('click', pauseSound);
      document.getElementById('btnReplay').addEventListener('click', replaySound);
      document.getElementById('btnNext').addEventListener('click', nextSound);

      function handleHostCommand(data) {
        var cmd = null, payload = null;
        if (typeof data === 'string') {
          try { var p = JSON.parse(data); if (p && p.type) cmd = p.type; else if (p && p.command) cmd = p.command; else cmd = data; payload = p; } catch (e) { cmd = data; }
        } else if (data && typeof data === 'object') { cmd = data.type || data.command || data.action || data.message; payload = data; }
        if (payload && (payload.volume != null || payload.value != null)) {
          var v = parseFloat(payload.volume != null ? payload.volume : payload.value);
          if (isFinite(v)) { if (v > 1) v /= 100; pendingVolume = Math.max(0, Math.min(1, v)); setEmbedVolume(pendingVolume); if (cmd === 'volume' || cmd === 'setVolume') return; }
        }
        if (typeof cmd === 'string' && cmd.indexOf('volume') !== -1) {
          var m = cmd.match(/([0-9]*\.?[0-9]+)/); if (m) { var v2 = parseFloat(m[1]); if (v2 > 1) v2 /= 100; if (isFinite(v2)) pendingVolume = v2; setEmbedVolume(v2); return; }
        }
        if (cmd === 'play' || data === 'play') { playSound(); return; }
        if (cmd === 'pause' || data === 'pause') { pauseSound(); return; }
        if (cmd === 'replay' || cmd === 'next' || data === 'replay' || data === 'next') { if (cmd === 'replay' || data === 'replay') replaySound(); else nextSound(); return; }
      }

      // WebView2 bridge — SAMA PERSIS dengan api-soundcloud
      if (window.chrome && window.chrome.webview) {
        log('WebView2 bridge detected');
        try {
          window.chrome.webview.addEventListener('message', function (event) {
            var data = event.data;
            if (data === 'pause') { pauseSound(); return; }
            if (data === 'play') { playSound(); return; }
            if (data === 'replay') { replaySound(); return; }
            if (data === 'next') { nextSound(); return; }
            try {
              var parsed = null;
              if (typeof data === 'string') { try { parsed = JSON.parse(data); } catch (e) { } if (parsed && parsed.volume != null) { handleHostCommand(data); return; } }
              else if (data && (data.volume != null || data.value != null)) { handleHostCommand(data); return; }
            } catch (e) { }
            handleHostCommand(data);
          });
        } catch (e) { log('webview addEventListener err', e); }
      } else { log('WebView2 NOT detected'); }

      window.addEventListener('message', function (e) {
        var d = e.data; if (!d) return;
        if (typeof d === 'object' && (d.type === 'playback_update' || d.type === 'ready' || d.payload)) return;
        if (typeof d === 'string') {
          if (d === 'pause' || d === 'play' || d === 'replay' || d === 'next') { handleHostCommand(d); return; }
          try { var p2 = JSON.parse(d); if (p2 && (p2.type === 'play' || p2.type === 'pause')) { handleHostCommand(d); return; } } catch (e) { }
        }
        handleHostCommand(d);
      });

      // init
      if (!trackId) { showError('Missing trackId parameter'); }
      else {
        // kalau initialTrack sudah ada (dari VB), render langsung biar tidak nunggu fetch
        if (initialTrack && initialTrack.title) {
          render({
            title: initialTrack.title || 'Unknown',
            artist: initialTrack.artist || '',
            thumbnail: initialTrack.thumbnail || '',
            duration: initialTrack.duration || '0:00',
            durationMs: initialTrack.durationMs || 0,
            album: initialTrack.album || null,
            explicit: false,
            trackId: trackId
          });
          // fetch tetap untuk enrich data akurat
          fetch('/track?trackId=' + encodeURIComponent(trackId)).then(function (r) { if (!r.ok) throw new Error('Track not found'); return r.json(); }).then(function (t) { metaTrack = t; if (t.durationMs) trackDurationMs = t.durationMs; var art = t.thumbnail; if (art) { var img = document.querySelector('#artwork img'); if (img) img.src = art; document.getElementById('bg').style.backgroundImage = "url('" + art.replace(/'/g, "\\'") + "')"; } var h1 = document.querySelector('.info h1'); if (h1 && t.title) h1.textContent = t.title; var h2 = document.querySelector('.info h2'); if (h2 && t.artist) h2.textContent = t.artist; }).catch(function () { });
        } else {
          fetch('/track?trackId=' + encodeURIComponent(trackId)).then(function (res) { if (!res.ok) throw new Error('Track not found (HTTP ' + res.status + ')'); return res.json(); }).then(render).catch(function (e) { showError(e.message); });
        }
      }
    })();
  </script>
