<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spotify Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      width: 100%;
      height: 100%
    }

    body {
      overflow: hidden;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg {
      position: fixed;
      inset: -80px;
      z-index: 0;
      background-size: cover;
      background-position: center;
      filter: blur(80px) brightness(.35) saturate(1.3);
      transform: scale(1.15);
      transition: background-image .6s ease
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, .15) 0%, rgba(0, 0, 0, .65) 100%)
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(1120px, calc(100% - 48px));
      /* Ubah height menjadi max-height atau gunakan auto dengan batas max */
      height: 100%;
      max-height: 500px;
      display: grid;
      grid-template-columns: min(46vw, 500px) minmax(0, 1fr);
      /* Ubah baris kedua agar menggunakan auto alih-alih 166px kaku */
      grid-template-rows: minmax(0, 1fr) auto;
      align-content: center;
      align-items: stretch;
      justify-content: center;
      column-gap: clamp(30px, 4vw, 64px);
      padding: 0;
      margin: auto;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .artwork {
      grid-column: 1;
      grid-row: 1 / span 2;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      justify-self: stretch;
      align-self: stretch;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .6);
      background: rgba(255, 255, 255, .06)
    }

    .artwork img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity .4s ease
    }

    .artwork img.loaded {
      opacity: 1
    }

    #loadingWrap {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 5
    }

    .info {
      grid-column: 2;
      grid-row: 1;
      text-align: left;
      max-width: none;
      width: 100%;
      min-width: 0;
      align-self: start;
      padding-top: 4px;
      overflow: hidden
    }

    .info h1 {
      color: #fff;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 700;
      white-space: nowrap;
      display: inline-block;
      padding-left: 100%;
      animation: scrollText 12s linear infinite
    }

    @keyframes scrollText {
      0% {
        transform: translateX(0)
      }

      100% {
        transform: translateX(-100%)
      }
    }

    .info h2 {
      color: rgba(255, 255, 255, .7);
      font-size: clamp(14px, 2vw, 18px);
      margin-top: 6px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .info .stats {
      color: rgba(255, 255, 255, .45);
      font-size: 13px;
      margin-top: 16px;
      display: flex;
      gap: 18px;
      justify-content: flex-start;
      flex-wrap: wrap;
      align-items: center;
    }

    #btnShowLyrics {
      display: none;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    #btnShowLyrics:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    #btnShowLyrics:active {
      transform: scale(0.95);
    }

.player {
      grid-column: 2;
      grid-row: 2;
      width: 100%;
      /* Hapus height: 166px yang kaku atau ubah jadi auto */
      height: auto;
      max-width: none;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .5);
      align-self: end;
      background: rgba(0, 0, 0, .2)
    }

    .player iframe {
      width: 100%;
      /* Ubah height menjadi 166px maksimal atau biarkan mengisi penuh player */
      height: 152px; 
      border: 0;
      display: block;
      background: #181818
    }

    /* =========================================
       FULLSCREEN LYRICS VIEW (SPOTIFY DESKTOP STYLE)
       ========================================= */
    #lyricsView {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(30px) brightness(0.3);
      -webkit-backdrop-filter: blur(30px) brightness(0.3);
    }

    #lyricsView.active {
      opacity: 1;
      pointer-events: auto;
    }

    #btnCloseLyrics {
      position: absolute;
      top: 30px;
      right: 30px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
      z-index: 12;
    }

    #btnCloseLyrics:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }

    /* Viewport Lirik dengan efek fade di atas dan bawah */
    .lyrics-viewport {
      width: 100%;
      height: 100vh;
      overflow-y: auto;
      padding: 0 5vw;
      /* Responsif margin kiri-kanan */

      /* Efek gradien menghilang di ujung atas dan bawah */
      mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);

      /* Menyembunyikan scrollbar */
      scrollbar-width: none;
      -ms-overflow-style: none;
      z-index: 11;
    }

    .lyrics-viewport::-webkit-scrollbar {
      display: none;
    }

    /* Container dalam untuk memberikan ruang scroll ekstra */
    #lyricsContainer {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 45vh 0;
      /* Memberikan ruang agar lirik pertama/terakhir bisa ke tengah layar */
      max-width: 900px;
      margin: 0 auto;
    }

    /* Styling Baris Lirik */
    .lyric-line {
      font-size: clamp(28px, 4.5vw, 48px);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.03em;
      color: rgba(255, 255, 255, 0.45);
      transition: color 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
      cursor: pointer;
      transform-origin: left center;
    }

    .lyric-line:hover {
      color: rgba(255, 255, 255, 0.8);
    }

    .lyric-line.active {
      color: #ffffff;
      transform: scale(1.02);
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .lyric-line.unsynced {
      font-size: clamp(20px, 3.5vw, 36px);
      margin-bottom: 16px;
    }

    /* Saat lirik aktif: sembunyikan artwork/info, tapi iframe tetap tampil kanan-bawah */
    body.lyrics-active .content {
      opacity: 1;
      transform: none;
      pointer-events: none;
      z-index: 20;
    }

    body.lyrics-active .artwork,
    body.lyrics-active .info {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    body.lyrics-active .player {
      position: fixed;
      right: 28px;
      bottom: 28px;
      width: min(340px, calc(100vw - 48px));
      height: 166px;
      z-index: 30;
      opacity: 1;
      pointer-events: auto;
      border-radius: 14px;
    }

    /* Geser lirik sedikit ke kiri agar tidak tertutup iframe */
    body.lyrics-active .lyrics-viewport {
      padding: 0 calc(min(340px, calc(100vw - 48px)) + 60px) 0 5vw;
    }

    body.lyrics-active #lyricsContainer {
      max-width: 760px;
      margin: 0 auto 0 0;
    }

    @media (max-width:760px) {
      .content {
        width: 100%;
        height: auto;
        min-height: 100%;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        align-content: center;
        justify-items: center;
        align-items: center;
        row-gap: 28px;
        padding: 24px 18px;
        overflow: auto
      }

      .artwork {
        grid-column: 1;
        grid-row: 1;
        width: min(78vw, 360px);
        height: auto;
        aspect-ratio: 1;
      }

      .info {
        grid-column: 1;
        grid-row: 2;
        text-align: center;
        width: 100%;
        padding-top: 0;
      }

      .info .stats {
        justify-content: center
      }

      .player {
        grid-column: 1;
        grid-row: 3;
        width: 100%;
        height: 166px;
      }

      #btnCloseLyrics {
        top: 15px;
        right: 15px;
        width: 36px;
        height: 36px;
        font-size: 20px;
      }

      .lyrics-viewport {
        padding: 0 24px;
      }

      body.lyrics-active .player {
        right: 12px;
        left: 12px;
        bottom: 12px;
        width: auto;
        height: 152px;
      }

      body.lyrics-active .player iframe {
        height: 152px;
      }

      body.lyrics-active .lyrics-viewport {
        padding: 0 24px 190px;
      }

      body.lyrics-active #lyricsContainer {
        max-width: 100%;
        margin: 0 auto;
      }

      body.lyrics-active #controls {
        bottom: 178px;
      }
    }

    #controls {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 20;
      align-items: center;
      gap: 14px;
      background: rgba(0, 0, 0, .72);
      border: 1px solid rgba(255, 255, 255, .12);
      padding: 12px 22px;
      border-radius: 50px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, .5);
      backdrop-filter: blur(8px)
    }

    #controls .ctl-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #fff;
      background: rgba(255, 255, 255, .12);
      transition: background .2s;
      display: flex;
      align-items: center;
      justify-content: center
    }

    #controls .ctl-btn:hover {
      background: rgba(255, 255, 255, .25)
    }

    #controls .ctl-btn.main {
      background: #1db954;
    }

    #controls #btnLyrics.active {
      background: #1db954;
    }

    @keyframes replayPulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
        background: rgba(255, 255, 255, .3);
      }

      100% {
        transform: scale(1);
      }
    }

    #btnReplay.replaying {
      animation: replayPulse 0.4s ease;
    }

    .loading {
      color: rgba(255, 255, 255, .8);
      font-size: 14px;
      letter-spacing: .5px
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .15);
      border-top-color: #1db954;
      animation: spin .8s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .error {
      color: #fff;
      font-size: 16px;
      text-align: center;
      max-width: 480px;
      padding: 20px
    }

    .error small {
      display: block;
      margin-top: 10px;
      color: rgba(255, 255, 255, .5);
      font-size: 12px
    }
  </style>
</head>

<body>
  <div class="bg" id="bg"></div>
  <div class="bg-overlay"></div>

  <div class="content" id="content">
    <div id="loadingWrap" style="display:flex;flex-direction:column;align-items:center;gap:16px">
      <div class="spinner"></div>
      <div class="loading">Loading track...</div>
    </div>
  </div>

  <!-- LYRICS VIEW -->
  <div id="lyricsView">
    <button id="btnCloseLyrics" title="Close Lyrics">×</button>
    <div class="lyrics-viewport">
      <div id="lyricsContainer">
        <!-- Lirik akan di-inject ke sini -->
      </div>
    </div>
  </div>

  <div id="controls">
    <button class="ctl-btn" id="btnReplay" title="Replay">⟳</button>
    <button class="ctl-btn" id="btnPrev" title="Pause">⏸</button>
    <button class="ctl-btn main" id="btnPlay" title="Play">▶</button>
    <button class="ctl-btn" id="btnNext" title="Next">⏭</button>
    <button class="ctl-btn" id="btnLyrics" title="Show Lyrics" style="display:none">🎤</button>
  </div>

  <script>
    (function () {
      // ===== CONFIG =====
      var params = new URLSearchParams(location.search);
      var trackId = params.get('trackId');
      var spDc = params.get('sp_dc') || params.get('spDC') || '';
      var credQs = spDc ? '&sp_dc=' + encodeURIComponent(spDc) : '';

      // ===== STATE =====
      var isPlaying = false;
      var endedSent = false;
      var embedReady = false;
      var checkInterval = null;

      // Lyrics State
      var lyricsData = null;
      var currentPosition = 0; // dalam milidetik
      var activeLineIndex = -1;
      var isLyricsActive = false;

      // ===== DOM =====
      var loadingWrap = document.getElementById('loadingWrap');
      var bgEl = document.getElementById('bg');
      var btnReplay = document.getElementById('btnReplay');
      var btnPlay = document.getElementById('btnPlay');

      var lyricsView = document.getElementById('lyricsView');
      var lyricsViewport = document.querySelector('.lyrics-viewport');
      var lyricsContainer = document.getElementById('lyricsContainer');
      var btnCloseLyrics = document.getElementById('btnCloseLyrics');

      function log(msg) { console.log('[SP]', msg); }

      function sendToHost(msg) {
        try {
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(msg);
            return;
          }
        } catch (e) { }
        try {
          window.postMessage({ type: msg, trackId: trackId }, '*');
        } catch (e) { }
      }

      function notifyEnded() {
        if (endedSent) return;
        endedSent = true;
        isPlaying = false;
        if (btnPlay) {
          btnPlay.innerHTML = '▶';
          btnPlay.classList.remove('playing');
        }
        sendToHost('videoEnded');
        try {
          window.dispatchEvent(new CustomEvent('videoEnded', { detail: { trackId: trackId } }));
        } catch (e) { }
      }

      function showError(msg) {
        if (loadingWrap) loadingWrap.style.display = 'none';
        var err = document.createElement('div');
        err.className = 'error';
        err.innerHTML = '<strong>' + msg + '</strong><small>Check trackId or sp_dc</small>';
        document.getElementById('content').appendChild(err);
      }

      // ===== EMBED HELPERS =====
      function getIframe() {
        return document.getElementById('spWidget');
      }

      function getEmbedDoc() {
        var iframe = getIframe();
        try { return iframe && iframe.contentDocument ? iframe.contentDocument : null; } catch (e) { return null; }
      }

      function isActuallyPlaying() {
        try {
          var doc = getEmbedDoc();
          if (doc) {
            var audios = doc.querySelectorAll('audio,video');
            for (var i = 0; i < audios.length; i++) {
              var a = audios[i];
              if (!a.paused && !a.ended && a.currentTime > 0) {
                currentPosition = a.currentTime * 1000;
                return true;
              }
            }
            if (doc.querySelector('button[aria-label="Pause"], button[aria-label="Jeda"]')) {
              return true;
            }
          }
        } catch (e) { }
        return false;
      }

      function getMediaElement() {
        try {
          var doc = getEmbedDoc();
          if (doc) {
            return doc.querySelector('audio, video');
          }
        } catch (e) { }
        return null;
      }

      // ===== PLAY / PAUSE =====
      function playSound() {
        if (!embedReady) return;
        endedSent = false;
        isPlaying = true;
        if (btnPlay) {
          btnPlay.innerHTML = '⏸';
          btnPlay.classList.add('playing');
        }

        var iframe = getIframe();
        if (iframe) {
          try {
            iframe.contentWindow.postMessage({ command: 'play' }, 'https://open.spotify.com');
          } catch (e) { }
        }

        try {
          var doc = getEmbedDoc();
          if (doc) {
            var selectors = [
              'button[data-testid="play-pause-button"]',
              'button[data-testid="play-button"]',
              'button[aria-label="Play"]',
              'button[aria-label="Putar"]'
            ];
            for (var i = 0; i < selectors.length; i++) {
              try {
                var btn = doc.querySelector(selectors[i]);
                if (btn && !btn.disabled) {
                  var label = (btn.getAttribute('aria-label') || '').toLowerCase();
                  if (label.indexOf('pause') === -1 && label.indexOf('jeda') === -1) {
                    btn.click();
                    isPlaying = true;
                    break;
                  }
                }
              } catch (e) { }
            }
          }
        } catch (e) { }

        setTimeout(function () {
          if (isActuallyPlaying()) {
            isPlaying = true;
            if (btnPlay) {
              btnPlay.innerHTML = '⏸';
              btnPlay.classList.add('playing');
            }
          }
        }, 1000);
      }

      function pauseSound() {
        isPlaying = false;
        if (btnPlay) {
          btnPlay.innerHTML = '▶';
          btnPlay.classList.remove('playing');
        }

        var iframe = getIframe();
        if (iframe) {
          try {
            iframe.contentWindow.postMessage({ command: 'pause' }, 'https://open.spotify.com');
          } catch (e) { }
        }

        try {
          var doc = getEmbedDoc();
          if (doc) {
            var btn = doc.querySelector('button[aria-label="Pause"], button[aria-label="Jeda"]');
            if (btn) btn.click();
            doc.querySelectorAll('audio,video').forEach(function (a) { try { a.pause(); } catch (e) { } });
          }
        } catch (e) { }
      }

      // ===== REPLAY =====
      function replaySound() {
        if (btnReplay) {
          btnReplay.classList.remove('replaying');
          void btnReplay.offsetWidth;
          btnReplay.classList.add('replaying');
          setTimeout(function () {
            btnReplay.classList.remove('replaying');
          }, 400);
        }

        endedSent = false;
        isPlaying = true;
        currentPosition = 0;
        updateLyrics(true);

        if (btnPlay) {
          btnPlay.innerHTML = '⏸';
          btnPlay.classList.add('playing');
        }

        var media = getMediaElement();
        if (media) {
          try {
            media.currentTime = 0;
            var playPromise = media.play();
            if (playPromise !== undefined) {
              playPromise.then(function () {
                isPlaying = true;
                if (btnPlay) {
                  btnPlay.innerHTML = '⏸';
                  btnPlay.classList.add('playing');
                }
              }).catch(function () {
                replayFallback();
              });
            }
            return;
          } catch (e) { }
        }
        replayFallback();
      }

      function replayFallback() {
        try {
          var doc = getEmbedDoc();
          if (doc) {
            var selectors = [
              'button[data-testid="play-pause-button"]',
              'button[data-testid="play-button"]',
              'button[aria-label="Play"]',
              'button[aria-label="Putar"]'
            ];
            for (var i = 0; i < selectors.length; i++) {
              try {
                var btn = doc.querySelector(selectors[i]);
                if (btn && !btn.disabled) {
                  var label = (btn.getAttribute('aria-label') || '').toLowerCase();
                  if (label.indexOf('pause') === -1 && label.indexOf('jeda') === -1) {
                    btn.click();
                    isPlaying = true;
                    if (btnPlay) {
                      btnPlay.innerHTML = '⏸';
                      btnPlay.classList.add('playing');
                    }
                    return;
                  }
                }
              } catch (e) { }
            }
            var media = doc.querySelector('audio, video');
            if (media) {
              media.currentTime = 0;
              media.play().catch(function () { });
              isPlaying = true;
              if (btnPlay) {
                btnPlay.innerHTML = '⏸';
                btnPlay.classList.add('playing');
              }
              return;
            }
          }
        } catch (e) { }

        var iframe = getIframe();
        if (iframe) {
          var src = iframe.src;
          iframe.src = 'about:blank';
          setTimeout(function () {
            iframe.src = src;
            embedReady = false;
            setTimeout(function () {
              embedReady = true;
              setTimeout(function () { playSound(); }, 500);
            }, 1500);
          }, 300);
        }
      }

      function nextSound() {
        sendToHost('nextRequested');
        setTimeout(function () { replaySound(); }, 500);
      }

      function togglePlay() {
        if (isPlaying) {
          pauseSound();
        } else {
          playSound();
        }
      }

      // ===== LYRICS LOGIC =====
      function fetchLyrics() {
        fetch('/lyrics?trackId=' + encodeURIComponent(trackId) + credQs)
          .then(function (res) {
            if (!res.ok) throw new Error('No lyrics');
            return res.json();
          })
          .then(function (data) {
            if (data && data.lines && data.lines.length > 0) {
              lyricsData = data;
              renderLyrics();
              var btn = document.getElementById('btnShowLyrics');
              if (btn) btn.style.display = 'inline-block';
              var btnCtl = document.getElementById('btnLyrics');
              if (btnCtl) btnCtl.style.display = 'flex';
            }
          })
          .catch(function (err) {
            log('Lyrics not available');
          });
      }

      function renderLyrics() {
        if (!lyricsData) return;
        lyricsContainer.innerHTML = '';

        var isSynced = lyricsData.hasSync;

        lyricsData.lines.forEach(function (line, index) {
          var el = document.createElement('div');
          el.className = 'lyric-line' + (isSynced ? '' : ' unsynced');
          el.textContent = line.text || '\u00A0';
          el.dataset.index = index;

          if (isSynced) {
            el.addEventListener('click', function () {
              seekTo(line.startMs);
            });
          }

          lyricsContainer.appendChild(el);
        });
      }

      function seekTo(ms) {
        try {
          var doc = getEmbedDoc();
          if (doc) {
            var media = doc.querySelector('audio, video');
            if (media) {
              media.currentTime = ms / 1000;
              if (!isPlaying) togglePlay();
              currentPosition = ms;
              updateLyrics(true);
            }
          }
        } catch (e) { }
      }

      function updateLyrics(forceScroll) {
        if (!isLyricsActive || !lyricsData || !lyricsData.hasSync) return;

        var lines = lyricsData.lines;
        var newActiveIndex = -1;

        for (var i = 0; i < lines.length; i++) {
          if (currentPosition >= lines[i].startMs &&
            (i === lines.length - 1 || currentPosition < lines[i + 1].startMs)) {
            newActiveIndex = i;
            break;
          }
        }

        if (newActiveIndex !== activeLineIndex || forceScroll) {
          var els = lyricsContainer.getElementsByClassName('lyric-line');

          if (activeLineIndex >= 0 && activeLineIndex < els.length) {
            els[activeLineIndex].classList.remove('active');
          }

          activeLineIndex = newActiveIndex;

          if (activeLineIndex >= 0 && activeLineIndex < els.length) {
            var activeEl = els[activeLineIndex];
            activeEl.classList.add('active');

            // Hitung posisi center berdasarkan tinggi viewport (efek mask-image & padding)
            var viewportHeight = lyricsViewport.clientHeight;
            var elTop = activeEl.offsetTop; // Jarak relatif ke awal #lyricsContainer
            var elHeight = activeEl.clientHeight;

            lyricsViewport.scrollTo({
              top: elTop - (viewportHeight / 2) + (elHeight / 2),
              behavior: 'smooth'
            });
          }
        }
      }

      // ===== LYRICS SHOW / HIDE (dipakai tombol + host command + controls) =====
      function syncLyricsBtn() {
        var b = document.getElementById('btnLyrics');
        if (!b) return;
        if (isLyricsActive) {
          b.classList.add('active');
          b.title = 'Close Lyrics';
        } else {
          b.classList.remove('active');
          b.title = 'Show Lyrics';
        }
      }

      function showLyrics() {
        if (!lyricsView) return;
        lyricsView.classList.add('active');
        document.body.classList.add('lyrics-active');
        isLyricsActive = true;
        if (!lyricsData) fetchLyrics();
        updateLyrics(true);
        syncLyricsBtn();
      }

      function closeLyrics() {
        if (!lyricsView) return;
        lyricsView.classList.remove('active');
        document.body.classList.remove('lyrics-active');
        isLyricsActive = false;
        syncLyricsBtn();
      }

      function toggleLyrics() {
        if (isLyricsActive) {
          closeLyrics();
        } else {
          showLyrics();
        }
      }

      // Events for Lyrics Overlay
      btnCloseLyrics.addEventListener('click', closeLyrics);

      // ===== MONITOR PLAYBACK =====
      function startMonitoring() {
        if (checkInterval) clearInterval(checkInterval);

        checkInterval = setInterval(function () {
          if (!embedReady) return;

          try {
            var doc = getEmbedDoc();
            if (doc) {
              var media = doc.querySelector('audio,video');
              if (media) {
                currentPosition = media.currentTime * 1000;
                if (isLyricsActive) updateLyrics();
              }
            }
          } catch (e) { }

          var playing = isActuallyPlaying();

          if (playing && !isPlaying) {
            isPlaying = true;
            if (btnPlay) {
              btnPlay.innerHTML = '⏸';
              btnPlay.classList.add('playing');
            }
          }

          if (!playing && isPlaying) {
            try {
              var doc2 = getEmbedDoc();
              if (doc2) {
                var m = doc2.querySelector('audio,video');
                if (m) currentPosition = m.currentTime * 1000;
              }
            } catch (e) { }
          }

          try {
            var doc = getEmbedDoc();
            if (doc) {
              var audios = doc.querySelectorAll('audio,video');
              for (var i = 0; i < audios.length; i++) {
                var a = audios[i];
                if (a.ended && !a.paused && isPlaying) {
                  notifyEnded();
                }
              }
            }
          } catch (e) { }
        }, 500);
      }

      // ===== RENDER =====
      function render(track) {
        document.title = (track.title || 'Spotify') + ' - ' + (track.artist || '');
        if (loadingWrap) loadingWrap.style.display = 'none';

        if (track.thumbnail) {
          bgEl.style.backgroundImage = "url('" + track.thumbnail.replace(/'/g, "\\'") + "')";
        }

        var content = document.getElementById('content');

        var artwork = document.createElement('div');
        artwork.className = 'artwork';
        var img = document.createElement('img');
        img.alt = track.title || '';
        img.onload = function () { this.classList.add('loaded'); };
        if (track.thumbnail) img.src = track.thumbnail;
        artwork.appendChild(img);
        content.appendChild(artwork);

        var info = document.createElement('div');
        info.className = 'info';
        var stats = [];
        if (track.duration && track.duration !== '0:00') stats.push('⏱ ' + track.duration);
        if (track.album) stats.push(track.album);

        var statsHtml = stats.length ? stats.map(function (s) { return '<span>' + s + '</span>'; }).join('') : '';
        // statsHtml += '<button id="btnShowLyrics">Available Lyrics</button>';

        info.innerHTML = '<h1>' + (track.title || 'Unknown') + '</h1>' +
          '<h2>' + (track.artist || '') + '</h2>' +
          '<div class="stats">' + statsHtml + '</div>';

        content.appendChild(info);

        setTimeout(function () {
          var btnShow = document.getElementById('btnShowLyrics');
          if (btnShow) {
            btnShow.addEventListener('click', showLyrics);
            fetchLyrics();
          }
        }, 100);

        var player = document.createElement('div');
        player.className = 'player';
        var iframe = document.createElement('iframe');
        iframe.id = 'spWidget';
        iframe.setAttribute('allow', 'autoplay *; encrypted-media; fullscreen');
        iframe.setAttribute('allowFullscreen', '');
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('loading', 'eager');
        iframe.src = '/embed-proxy?trackId=' + encodeURIComponent(track.trackId || trackId) + credQs;
        player.appendChild(iframe);
        content.appendChild(player);

        iframe.onload = function () {
          embedReady = true;
          sendToHost('embed_ready');
          startMonitoring();

          setTimeout(function () {
            var btnPlay = document.getElementById('btnPlay');
            if (btnPlay) {
              btnPlay.click();
            } else {
              playSound();
            }
          }, 1000);
        };

        setTimeout(function () {
          if (!embedReady) {
            embedReady = true;
            startMonitoring();

            setTimeout(function () {
              var btnPlay = document.getElementById('btnPlay');
              if (btnPlay) {
                btnPlay.click();
              } else {
                playSound();
              }
            }, 1000);
          }
        }, 5000);
      }

      // ===== CONTROLS =====
      document.getElementById('btnPlay').addEventListener('click', togglePlay);
      document.getElementById('btnPrev').addEventListener('click', pauseSound);
      document.getElementById('btnReplay').addEventListener('click', replaySound);
      document.getElementById('btnNext').addEventListener('click', nextSound);
      document.getElementById('btnLyrics').addEventListener('click', toggleLyrics);

      // ===== EMBED MESSAGES =====
      window.addEventListener('message', function (e) {
        var data = e.data;
        if (!data || typeof data !== 'object') return;

        if (data.type === 'playback_update' || data.type === 'playback_started') {
          var payload = data.payload || data.data || {};

          if (payload.position !== undefined) {
            currentPosition = payload.position;
            if (isLyricsActive) updateLyrics();
          }

          if (payload.isPaused === false) {
            isPlaying = true;
            if (btnPlay) {
              btnPlay.innerHTML = '⏸';
              btnPlay.classList.add('playing');
            }
          }
          if (payload.isPaused === true) {
            isPlaying = false;
            if (btnPlay) {
              btnPlay.innerHTML = '▶';
              btnPlay.classList.remove('playing');
            }
          }
          if (payload.duration && payload.position &&
            (payload.duration - payload.position) <= 800 &&
            payload.isPaused === false) {
            setTimeout(notifyEnded, 400);
          }
        }

        if (data.type === 'ended' || data.type === 'track_ended') {
          notifyEnded();
        }
      });

      // ===== HOST COMMANDS =====
      function handleCommand(data) {
        var raw = typeof data === 'string' ? data : (data.type || data.command || '');
        var cmd = String(raw).toLowerCase().trim();
        var norm = cmd.replace(/[\s_\-]+/g, '');

        if (cmd === 'play') { playSound(); return; }
        if (cmd === 'pause') { pauseSound(); return; }
        if (cmd === 'replay' || cmd === 'repeat') { replaySound(); return; }
        if (cmd === 'next' || cmd === 'nextvideo' || cmd === 'nextsound' || cmd === 'skip') { nextSound(); return; }
        if (cmd === 'toggle' || cmd === 'playpause') { togglePlay(); return; }

        // Lyrics — logika host command sama seperti play/pause/replay/next:
        // bisa dipanggil kapan saja via WebView postMessage maupun window.postMessage,
        // walau lyrics overlay sedang tampil.
        if (norm === 'showlyrics' || norm === 'showlyric' || norm === 'showliric' ||
          norm === 'openlyrics' || norm === 'openlyric' || norm === 'showlyricsview' ||
          norm === 'lyrics' || norm === 'lyric' || norm === 'lirik') { showLyrics(); return; }
        if (norm === 'closelyrics' || norm === 'closelyric' || norm === 'closeliric' ||
          norm === 'hidelyrics' || norm === 'hidelyric' || norm === 'closelyricsview') { closeLyrics(); return; }
        if (norm === 'togglelyrics' || norm === 'togglelyric' || norm === 'toggleliric' ||
          norm === 'lyricstoggle') { toggleLyrics(); return; }
      }

      if (window.chrome && window.chrome.webview) {
        try {
          window.chrome.webview.addEventListener('message', function (e) {
            handleCommand(e.data);
          });
        } catch (e) { }
      }

      window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d) return;
        if (typeof d === 'object' && (d.type === 'playback_update' || d.type === 'playback_started')) return;
        handleCommand(d);
      });

      // ===== KEYBOARD =====
      document.addEventListener('keydown', function (e) {
        if (e.target.tagName === 'INPUT') return;

        if (e.key === 'Escape' && isLyricsActive) {
          btnCloseLyrics.click();
          return;
        }

        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePlay();
        }
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          nextSound();
        }
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          replaySound();
        }
        if (e.key === 'r' || e.key === 'R') {
          replaySound();
        }
      });

      // ===== INIT =====
      if (!trackId) { showError('Missing trackId'); return; }
      if (!spDc) { showError('Missing sp_dc'); return; }

      fetch('/track?trackId=' + encodeURIComponent(trackId) + credQs)
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function (track) {
          render(track);
        })
        .catch(function (err) {
          showError('Failed to load: ' + err.message);
        });

    })();
  </script>
</body>

</html>
