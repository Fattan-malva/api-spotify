<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spotify Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      width: 100%;
      height: 100%
    }

    body {
      overflow: hidden;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg {
      position: fixed;
      inset: -80px;
      z-index: 0;
      background-size: cover;
      background-position: center;
      filter: blur(80px) brightness(.35) saturate(1.3);
      transform: scale(1.15);
      transition: background-image .6s ease
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, .15) 0%, rgba(0, 0, 0, .65) 100%)
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(1120px, calc(100% - 48px));
      height: min(500px, calc(100vh - 48px));
      display: grid;
      grid-template-columns: min(46vw, 500px) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) 166px;
      align-content: center;
      align-items: stretch;
      justify-content: center;
      column-gap: clamp(30px, 4vw, 64px);
      padding: 0;
      margin: auto
    }

    .artwork {
      grid-column: 1;
      grid-row: 1 / span 2;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      justify-self: stretch;
      align-self: stretch;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .6);
      background: rgba(255, 255, 255, .06)
    }

    .artwork img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity .4s ease
    }

    .artwork img.loaded {
      opacity: 1
    }

    #loadingWrap {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 5
    }

    .info {
      grid-column: 2;
      grid-row: 1;
      text-align: left;
      max-width: none;
      width: 100%;
      min-width: 0;
      align-self: start;
      padding-top: 4px;
      overflow: hidden
    }

    .info h1 {
      color: #fff;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 700;
      white-space: nowrap;
      display: inline-block;
      padding-left: 100%;
      animation: scrollText 12s linear infinite
    }

    @keyframes scrollText {
      0% {
        transform: translateX(0)
      }

      100% {
        transform: translateX(-100%)
      }
    }

    .info h2 {
      color: rgba(255, 255, 255, .7);
      font-size: clamp(14px, 2vw, 18px);
      margin-top: 6px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .info .stats {
      color: rgba(255, 255, 255, .45);
      font-size: 13px;
      margin-top: 16px;
      display: flex;
      gap: 18px;
      justify-content: flex-start;
      flex-wrap: wrap
    }

    .player {
      grid-column: 2;
      grid-row: 2;
      width: 100%;
      height: 166px;
      max-width: none;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .5);
      align-self: end;
      background: rgba(0, 0, 0, .2)
    }

    .player iframe {
      width: 100%;
      height: 166px;
      border: 0;
      display: block;
      background: #181818
    }

    @media (max-width:760px) {
      .content {
        width: 100%;
        height: auto;
        min-height: 100%;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        align-content: center;
        justify-items: center;
        align-items: center;
        row-gap: 28px;
        padding: 24px 18px;
        overflow: auto
      }

      .artwork {
        grid-column: 1;
        grid-row: 1;
        width: min(78vw, 360px);
        height: auto;
        aspect-ratio: 1;
        justify-self: center;
        align-self: auto
      }

      .info {
        grid-column: 1;
        grid-row: 2;
        text-align: center;
        width: 100%;
        padding-top: 0;
        align-self: auto
      }

      .info .stats {
        justify-content: center
      }

      .player {
        grid-column: 1;
        grid-row: 3;
        width: 100%;
        height: 166px;
        align-self: auto
      }
    }

    #controls {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 20;
      align-items: center;
      gap: 14px;
      background: rgba(0, 0, 0, .72);
      border: 1px solid rgba(255, 255, 255, .12);
      padding: 12px 22px;
      border-radius: 50px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, .5);
      backdrop-filter: blur(8px)
    }

    #controls .ctl-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #fff;
      background: rgba(255, 255, 255, .12);
      transition: background .2s;
      display: flex;
      align-items: center;
      justify-content: center
    }

    #controls .ctl-btn:hover {
      background: rgba(255, 255, 255, .25)
    }

    #controls .ctl-btn.main {
      background: #1db954;
    }

    .loading {
      color: rgba(255, 255, 255, .8);
      font-size: 14px;
      letter-spacing: .5px
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .15);
      border-top-color: #1db954;
      animation: spin .8s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    /* Click hint - seperti SoundCloud */
    .click-hint {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .75);
      color: #fff;
      cursor: pointer;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: .5px;
      backdrop-filter: blur(4px);
    }

    .click-hint .play-ico {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #1db954;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 12px 40px rgba(29, 185, 84, .4);
      transition: transform .2s;
    }

    .click-hint .play-ico:hover {
      transform: scale(1.05);
    }

    .click-hint .play-ico::after {
      content: "";
      display: block;
      width: 0;
      height: 0;
      border-left: 26px solid #fff;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      margin-left: 6px;
    }

    .click-hint .sub {
      font-size: 14px;
      opacity: .6;
      margin-top: 8px;
    }

    .error {
      color: #fff;
      font-size: 16px;
      text-align: center;
      max-width: 480px;
      padding: 20px
    }

    .error small {
      display: block;
      margin-top: 10px;
      color: rgba(255, 255, 255, .5);
      font-size: 12px
    }

    #status {
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 100;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, .7);
      color: rgba(255, 255, 255, .55);
      font-size: 10px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease
    }

    #status.show {
      opacity: 1
    }
  </style>
</head>

<body>
  <div class="bg" id="bg"></div>
  <div class="bg-overlay"></div>
  <div class="content" id="content">
    <div id="loadingWrap" style="display:flex;flex-direction:column;align-items:center;gap:16px">
      <div class="spinner"></div>
      <div class="loading">Loading track...</div>
    </div>
  </div>
  <div id="controls">
    <button class="ctl-btn" id="btnReplay" title="Replay">&#9198;</button>
    <button class="ctl-btn" id="btnPrev" title="Pause">&#9208;</button>
    <button class="ctl-btn main" id="btnPlay" title="Play">&#9654;</button>
    <button class="ctl-btn" id="btnNext" title="Next">&#9197;</button>
  </div>
  <div id="status"></div>

  <script>
    (function () {
      // ===== CONFIG =====
      var params = new URLSearchParams(location.search);
      var trackId = params.get('trackId');
      var spDc = params.get('sp_dc') || params.get('spDC') || '';
      var credQs = spDc ? '&sp_dc=' + encodeURIComponent(spDc) : '';
      var targetVolume = 0.9;

      try {
        var v = parseFloat(params.get('volume'));
        if (isFinite(v)) {
          if (v > 1) v /= 100;
          targetVolume = Math.max(0, Math.min(1, v));
        }
      } catch (e) { }

      // ===== STATE =====
      var isPlaying = false;
      var endedSent = false;
      var embedReady = false;
      var hintShown = false;
      var hintEl = null;
      var checkInterval = null;

      // ===== DOM =====
      var statusEl = document.getElementById('status');
      var loadingWrap = document.getElementById('loadingWrap');
      var bgEl = document.getElementById('bg');

      function log(msg) { console.log('[SP]', msg); }

      function setStatus(msg) {
        if (!statusEl) return;
        statusEl.textContent = msg || '';
        if (msg) {
          statusEl.classList.add('show');
          setTimeout(function () { statusEl.classList.remove('show'); }, 2000);
        } else {
          statusEl.classList.remove('show');
        }
      }

      function sendToHost(msg) {
        try {
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(msg);
            return;
          }
        } catch (e) { }
        try {
          window.postMessage({ type: msg, trackId: trackId }, '*');
        } catch (e) { }
      }

      function notifyEnded() {
        if (endedSent) return;
        endedSent = true;
        isPlaying = false;
        sendToHost('videoEnded');
        try {
          window.dispatchEvent(new CustomEvent('videoEnded', { detail: { trackId: trackId } }));
        } catch (e) { }
      }

      function showError(msg) {
        if (loadingWrap) loadingWrap.style.display = 'none';
        var err = document.createElement('div');
        err.className = 'error';
        err.innerHTML = '<strong>' + msg + '</strong><small>Check trackId or sp_dc</small>';
        document.getElementById('content').appendChild(err);
      }

      // ===== CLICK HINT - seperti SoundCloud =====
      function ensureHint() {
        if (hintShown || hintEl) return;
        hintShown = true;
        hintEl = document.createElement('div');
        hintEl.className = 'click-hint';
        hintEl.innerHTML = '<div class="play-ico"></div><div>Click to play</div><div class="sub">Allow autoplay if prompted</div>';
        hintEl.addEventListener('click', function () {
          playSound();
          if (hintEl) {
            hintEl.remove();
            hintEl = null;
          }
        });
        document.body.appendChild(hintEl);
        log('Click hint shown');
      }

      function removeHint() {
        if (hintEl) {
          hintEl.remove();
          hintEl = null;
        }
        hintShown = true;
      }

      // ===== EMBED HELPERS =====
      function getIframe() {
        return document.getElementById('spWidget');
      }

      function getEmbedDoc() {
        var iframe = getIframe();
        try { return iframe && iframe.contentDocument ? iframe.contentDocument : null; } catch (e) { return null; }
      }

      function getEmbedWin() {
        var iframe = getIframe();
        try { return iframe && iframe.contentWindow ? iframe.contentWindow : null; } catch (e) { return null; }
      }

      function setVolume(vol) {
        if (!isFinite(vol)) return;
        if (vol > 1) vol /= 100;
        targetVolume = Math.max(0, Math.min(1, vol));

        var doc = getEmbedDoc();
        if (doc) {
          try {
            doc.querySelectorAll('audio,video').forEach(function (a) {
              a.volume = targetVolume;
              a.muted = false;
            });
          } catch (e) { }
        }

        var win = getEmbedWin();
        if (win) {
          try { win.postMessage({ command: 'setVolume', volume: targetVolume }, '*'); } catch (e) { }
        }
      }

      // ===== PLAY / PAUSE =====
      function clickPlayButton() {
        var doc = getEmbedDoc();
        var win = getEmbedWin();

        if (win) {
          try {
            win.postMessage({ command: 'play' }, '*');
            win.postMessage({ type: 'play' }, '*');
          } catch (e) { }
        }

        if (doc) {
          var selectors = [
            'button[data-testid="play-pause-button"]',
            'button[data-testid="play-button"]',
            'button[aria-label="Play"]',
            'button[aria-label="Putar"]'
          ];

          for (var i = 0; i < selectors.length; i++) {
            try {
              var btn = doc.querySelector(selectors[i]);
              if (btn && !btn.disabled) {
                var label = (btn.getAttribute('aria-label') || '').toLowerCase();
                if (label.indexOf('pause') === -1 && label.indexOf('jeda') === -1) {
                  btn.click();
                  log('Play clicked');
                  return true;
                }
              }
            } catch (e) { }
          }

          var allBtns = doc.querySelectorAll('button');
          for (var b = 0; b < allBtns.length; b++) {
            try {
              var bx = allBtns[b];
              if (bx.disabled) continue;
              var label = (bx.getAttribute('aria-label') || bx.getAttribute('title') || '').toLowerCase();
              if ((label.indexOf('play') !== -1 || label.indexOf('putar') !== -1) &&
                label.indexOf('pause') === -1 && label.indexOf('jeda') === -1) {
                bx.click();
                log('Play clicked fallback');
                return true;
              }
            } catch (e) { }
          }
        }
        return false;
      }

      function clickPauseButton() {
        var doc = getEmbedDoc();
        var win = getEmbedWin();

        if (win) {
          try { win.postMessage({ command: 'pause' }, '*'); } catch (e) { }
        }

        if (doc) {
          var btn = doc.querySelector('button[aria-label="Pause"], button[aria-label="Jeda"]');
          if (btn) btn.click();
          doc.querySelectorAll('audio,video').forEach(function (a) { try { a.pause(); } catch (e) { } });
        }
      }

      function isActuallyPlaying() {
        try {
          var doc = getEmbedDoc();
          if (doc) {
            var audios = doc.querySelectorAll('audio,video');
            for (var i = 0; i < audios.length; i++) {
              var a = audios[i];
              if (!a.paused && !a.ended && a.currentTime > 0) {
                return true;
              }
            }
            if (doc.querySelector('button[aria-label="Pause"], button[aria-label="Jeda"]')) {
              return true;
            }
          }
        } catch (e) { }
        return false;
      }

      function playSound() {
        log('Play called');
        if (!embedReady) {
          log('Embed not ready, showing hint');
          ensureHint();
          return;
        }

        endedSent = false;
        removeHint();
        setVolume(targetVolume);
        clickPlayButton();

        // Check if actually playing after delay
        setTimeout(function () {
          if (!isActuallyPlaying()) {
            log('Not playing, showing hint');
            ensureHint();
          } else {
            isPlaying = true;
            setStatus('playing');
          }
        }, 1500);
      }

      function pauseSound() {
        log('Pause called');
        removeHint();
        isPlaying = false;
        setStatus('paused');
        clickPauseButton();
      }

      function replaySound() {
        log('Replay called');
        if (!embedReady) return;
        endedSent = false;
        isPlaying = false;
        removeHint();

        var iframe = getIframe();
        if (iframe) {
          iframe.src = '/embed-proxy?trackId=' + encodeURIComponent(trackId) + credQs + '&t=' + Date.now();
          embedReady = false;
          iframe.onload = function () {
            embedReady = true;
            setVolume(targetVolume);
            setTimeout(function () {
              playSound();
            }, 500);
          };
        }
      }

      function nextSound() {
        log('Next called');
        sendToHost('nextRequested');
        replaySound();
      }

      // ===== MONITOR PLAYBACK - seperti SoundCloud check =====
      function startMonitoring() {
        if (checkInterval) clearInterval(checkInterval);

        checkInterval = setInterval(function () {
          if (!embedReady) return;

          var playing = isActuallyPlaying();

          if (playing && !isPlaying) {
            isPlaying = true;
            setStatus('playing');
            removeHint();
            log('Playback detected');
          }

          if (!playing && isPlaying) {
            // Mungkin pause atau ended
            // Tapi jangan auto-reset, biar user control
          }

          // Cek ended via audio element
          try {
            var doc = getEmbedDoc();
            if (doc) {
              var audios = doc.querySelectorAll('audio,video');
              for (var i = 0; i < audios.length; i++) {
                var a = audios[i];
                if (a.ended && !a.paused && isPlaying) {
                  log('Audio ended detected');
                  notifyEnded();
                }
              }
            }
          } catch (e) { }
        }, 2000);
      }

      // ===== RENDER =====
      function render(track) {
        document.title = (track.title || 'Spotify') + ' - ' + (track.artist || '');

        if (loadingWrap) loadingWrap.style.display = 'none';

        if (track.thumbnail) {
          bgEl.style.backgroundImage = "url('" + track.thumbnail.replace(/'/g, "\\'") + "')";
        }

        var content = document.getElementById('content');

        // Artwork
        var artwork = document.createElement('div');
        artwork.className = 'artwork';
        var img = document.createElement('img');
        img.alt = track.title || '';
        img.onload = function () { this.classList.add('loaded'); };
        if (track.thumbnail) img.src = track.thumbnail;
        artwork.appendChild(img);
        content.appendChild(artwork);

        // Info
        var info = document.createElement('div');
        info.className = 'info';
        var stats = [];
        if (track.duration && track.duration !== '0:00') stats.push('⏱ ' + track.duration);
        if (track.album) stats.push(track.album);

        info.innerHTML = '<h1>' + (track.title || 'Unknown') + '</h1>' +
          '<h2>' + (track.artist || '') + '</h2>' +
          (stats.length ? '<div class="stats">' + stats.map(function (s) { return '<span>' + s + '</span>'; }).join('') +
            '</div>' : '');
        content.appendChild(info);

        // Player
        var player = document.createElement('div');
        player.className = 'player';
        var iframe = document.createElement('iframe');
        iframe.id = 'spWidget';
        iframe.setAttribute('allow', 'autoplay *; encrypted-media; fullscreen');
        iframe.setAttribute('allowFullscreen', '');
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('loading', 'eager');
        iframe.src = '/embed-proxy?trackId=' + encodeURIComponent(track.trackId || trackId) + credQs;
        player.appendChild(iframe);
        content.appendChild(player);

        log('Embed injected');

        iframe.onload = function () {
          log('Embed loaded');
          embedReady = true;
          setVolume(targetVolume);
          setStatus('ready');
          sendToHost('embed_ready');

          // Mulai monitoring
          startMonitoring();

          // Coba play otomatis
          setTimeout(function () {
            if (!isActuallyPlaying()) {
              log('Auto-play attempt');
              clickPlayButton();
              // Jika masih tidak play, show hint
              setTimeout(function () {
                if (!isActuallyPlaying() && !hintShown) {
                  ensureHint();
                } else {
                  isPlaying = true;
                  setStatus('playing');
                  removeHint();
                }
              }, 2000);
            } else {
              isPlaying = true;
              setStatus('playing');
              removeHint();
            }
          }, 1000);
        };

        // Fallback
        setTimeout(function () {
          if (!embedReady) {
            log('Embed onload fallback');
            embedReady = true;
            setVolume(targetVolume);
            startMonitoring();
            setTimeout(function () {
              clickPlayButton();
              setTimeout(function () {
                if (!isActuallyPlaying() && !hintShown) {
                  ensureHint();
                } else {
                  isPlaying = true;
                  setStatus('playing');
                  removeHint();
                }
              }, 2000);
            }, 500);
          }
        }, 5000);
      }

      // ===== CONTROLS =====
      document.getElementById('btnPlay').addEventListener('click', playSound);
      document.getElementById('btnPrev').addEventListener('click', pauseSound);
      document.getElementById('btnReplay').addEventListener('click', replaySound);
      document.getElementById('btnNext').addEventListener('click', nextSound);

      // ===== EMBED MESSAGES =====
      window.addEventListener('message', function (e) {
        var data = e.data;
        if (!data || typeof data !== 'object') return;

        if (data.type === 'playback_update' || data.type === 'playback_started') {
          var payload = data.payload || data.data || {};
          if (payload.isPaused === false) {
            isPlaying = true;
            setStatus('playing');
            removeHint();
          }
          if (payload.isPaused === true) {
            isPlaying = false;
            setStatus('paused');
          }
          if (payload.duration && payload.position &&
            (payload.duration - payload.position) <= 800 &&
            payload.isPaused === false) {
            setTimeout(notifyEnded, 400);
          }
        }

        if (data.type === 'ended' || data.type === 'track_ended') {
          notifyEnded();
        }
      });

      // ===== HOST COMMANDS =====
      function handleCommand(data) {
        var cmd = typeof data === 'string' ? data : (data.type || data.command || '');
        cmd = String(cmd).toLowerCase();

        if (cmd === 'play') { playSound(); return; }
        if (cmd === 'pause') { pauseSound(); return; }
        if (cmd === 'replay' || cmd === 'repeat') { replaySound(); return; }
        if (cmd === 'next' || cmd === 'nextvideo' || cmd === 'nextsound' || cmd === 'skip') { nextSound(); return; }
        if (cmd.indexOf('volume') !== -1) {
          var m = cmd.match(/([0-9]*\.?[0-9]+)/);
          if (m) {
            var v = parseFloat(m[1]);
            if (v > 1) v /= 100;
            if (isFinite(v)) {
              targetVolume = v;
              setVolume(v);
            }
          }
          return;
        }
      }

      if (window.chrome && window.chrome.webview) {
        try {
          window.chrome.webview.addEventListener('message', function (e) {
            handleCommand(e.data);
          });
        } catch (e) { }
      }

      window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d) return;
        if (typeof d === 'object' && (d.type === 'playback_update' || d.type === 'playback_started')) return;
        handleCommand(d);
      });

      // ===== KEYBOARD =====
      document.addEventListener('keydown', function (e) {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          if (isPlaying) {
            pauseSound();
          } else {
            playSound();
          }
        }
        if (e.key === 'ArrowRight') { nextSound(); }
        if (e.key === 'ArrowLeft') { replaySound(); }
      });

      // ===== INIT =====
      if (!trackId) { showError('Missing trackId'); return; }
      if (!spDc) { showError('Missing sp_dc'); return; }

      log('Fetching track info...');
      fetch('/track?trackId=' + encodeURIComponent(trackId) + credQs)
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function (track) {
          log('Track loaded');
          render(track);
        })
        .catch(function (err) {
          log('Error:', err);
          showError('Failed to load: ' + err.message);
        });

    })();
  </script>
</body>

</html>
