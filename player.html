<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spotify Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      width: 100%;
      height: 100%
    }

    body {
      overflow: hidden;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg {
      position: fixed;
      inset: -80px;
      z-index: 0;
      background-size: cover;
      background-position: center;
      filter: blur(80px) brightness(.35) saturate(1.3);
      transform: scale(1.15);
      transition: background-image .6s ease
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, .15) 0%, rgba(0, 0, 0, .65) 100%)
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(1120px, calc(100% - 48px));
      height: min(500px, calc(100vh - 48px));
      display: grid;
      grid-template-columns: min(46vw, 500px) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) 166px;
      align-content: center;
      align-items: stretch;
      justify-content: center;
      column-gap: clamp(30px, 4vw, 64px);
      padding: 0;
      margin: auto
    }

    .artwork {
      grid-column: 1;
      grid-row: 1 / span 2;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      justify-self: stretch;
      align-self: stretch;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .6);
      background: rgba(255, 255, 255, .06)
    }

    .artwork img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity .4s ease
    }

    .artwork img.loaded {
      opacity: 1
    }

    #loadingWrap {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 5
    }

    .info {
      grid-column: 2;
      grid-row: 1;
      text-align: left;
      max-width: none;
      width: 100%;
      min-width: 0;
      align-self: start;
      padding-top: 4px;
      overflow: hidden
    }

    .info h1 {
      color: #fff;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 700;
      white-space: nowrap;
      display: inline-block;
      padding-left: 100%;
      animation: scrollText 12s linear infinite
    }

    @keyframes scrollText {
      0% {
        transform: translateX(0)
      }

      100% {
        transform: translateX(-100%)
      }
    }

    .info h2 {
      color: rgba(255, 255, 255, .7);
      font-size: clamp(14px, 2vw, 18px);
      margin-top: 6px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .info .stats {
      color: rgba(255, 255, 255, .45);
      font-size: 13px;
      margin-top: 16px;
      display: flex;
      gap: 18px;
      justify-content: flex-start;
      flex-wrap: wrap
    }

    .player {
      grid-column: 2;
      grid-row: 2;
      width: 100%;
      height: 166px;
      max-width: none;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .5);
      align-self: end;
      background: rgba(0, 0, 0, .2)
    }

    .player iframe {
      width: 100%;
      height: 166px;
      border: 0;
      display: block;
      background: #181818
    }

    @media (max-width:760px) {
      .content {
        width: 100%;
        height: auto;
        min-height: 100%;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        align-content: center;
        justify-items: center;
        align-items: center;
        row-gap: 28px;
        padding: 24px 18px;
        overflow: auto
      }

      .artwork {
        grid-column: 1;
        grid-row: 1;
        width: min(78vw, 360px);
        height: auto;
        aspect-ratio: 1;
        justify-self: center;
        align-self: auto
      }

      .info {
        grid-column: 1;
        grid-row: 2;
        text-align: center;
        width: 100%;
        padding-top: 0;
        align-self: auto
      }

      .info .stats {
        justify-content: center
      }

      .player {
        grid-column: 1;
        grid-row: 3;
        width: 100%;
        height: 166px;
        align-self: auto
      }
    }

    #controls {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 20;
      align-items: center;
      gap: 14px;
      background: rgba(0, 0, 0, .72);
      border: 1px solid rgba(255, 255, 255, .12);
      padding: 12px 22px;
      border-radius: 50px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, .5);
      backdrop-filter: blur(8px)
    }

    #controls .ctl-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #fff;
      background: rgba(255, 255, 255, .12);
      transition: background .2s;
      display: flex;
      align-items: center;
      justify-content: center
    }

    #controls .ctl-btn:hover {
      background: rgba(255, 255, 255, .25)
    }

    #controls .ctl-btn.main {
      background: #1db954
    }

    .loading {
      color: rgba(255, 255, 255, .8);
      font-size: 14px;
      letter-spacing: .5px
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .15);
      border-top-color: #1db954;
      animation: spin .8s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .click-hint,
    .click-hint .play-ico {
      display: none !important;
      pointer-events: none !important;
      opacity: 0 !important;
      visibility: hidden !important
    }

    .error {
      color: #fff;
      font-size: 16px;
      text-align: center;
      max-width: 480px;
      padding: 20px
    }

    .error small {
      display: block;
      margin-top: 10px;
      color: rgba(255, 255, 255, .5);
      font-size: 12px
    }

    #status {
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 100;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, .7);
      color: rgba(255, 255, 255, .55);
      font-size: 10px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease
    }

    #status.show {
      opacity: 1
    }
  </style>
</head>

<body>
  <div class="bg" id="bg"></div>
  <div class="bg-overlay"></div>
  <div class="content" id="content">
    <div id="loadingWrap" style="display:flex;flex-direction:column;align-items:center;gap:16px">
      <div class="spinner"></div>
      <div class="loading">Loading track...</div>
    </div>
  </div>
  <div id="controls">
    <button class="ctl-btn" id="btnReplay" title="Replay">&#9198;</button>
    <button class="ctl-btn" id="btnPrev" title="Pause">&#9208;</button>
    <button class="ctl-btn main" id="btnPlay" title="Play">&#9654;</button>
    <button class="ctl-btn" id="btnNext" title="Next">&#9197;</button>
  </div>
  <div id="status"></div>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var trackId = params.get('trackId');
      var statusEl = document.getElementById('status');
      var spDc = params.get('sp_dc') || params.get('spDC') || params.get('SP_DC') || params.get('spDc') || '';
      var credQs = spDc ? '&sp_dc=' + encodeURIComponent(spDc) : '';

      var pendingVolume = 0.9;
      try {
        var v = parseFloat(params.get('volume'));
        if (isFinite(v)) { if (v > 1) v /= 100; pendingVolume = Math.max(0, Math.min(1, v)); }
      } catch (e) { }

      var initialTrack = null;
      try {
        var tTitle = params.get('title') || params.get('trackTitle');
        var tArtist = params.get('artist') || params.get('trackArtist');
        var tThumb = params.get('thumbnail') || params.get('thumb') || params.get('cover');
        var tDur = params.get('duration');
        var tDurMs = params.get('durationMs') || params.get('duration_ms');
        var tAlbum = params.get('album');
        var tJson = params.get('track');
        if (tJson) {
          try { initialTrack = JSON.parse(decodeURIComponent(tJson)); } catch (e) { }
        }
        if (!initialTrack && (tTitle || tArtist || tThumb || tDur)) {
          initialTrack = {
            title: tTitle ? decodeURIComponent(tTitle) : null,
            artist: tArtist ? decodeURIComponent(tArtist) : null,
            thumbnail: tThumb ? decodeURIComponent(tThumb) : null,
            duration: tDur ? decodeURIComponent(tDur) : null,
            durationMs: tDurMs ? parseInt(tDurMs, 10) : 0,
            album: tAlbum ? decodeURIComponent(tAlbum) : null
          };
        }
      } catch (e) { }

      var metaTrack = null;
      var trackDurationMs = initialTrack && initialTrack.durationMs ? initialTrack.durationMs : 0;
      var trackStartedAt = 0, isPlaying = false, endedSent = false, pollingInterval = null;
      var embedReady = false, pendingPlay = false;
      var embedLastPositionMs = 0, embedLastDurationMs = 0;
      var autoplayTimer = null, autoplayTries = 0, AUTOPLAY_MAX_TRIES = 30;
      var userGesturePrimed = false;
      var loadComplete = false;

      // Tanda bahwa semua sudah siap (artwork, info, player, embed)
      var readyFlags = {
        artworkLoaded: false,
        infoRendered: false,
        embedLoaded: false,
        trackDataLoaded: false
      };

      function log() { var a = [].slice.call(arguments); a.unshift('[SP]'); console.log.apply(console, a); }
      function setStatus(m) { if (!statusEl) return; statusEl.textContent = m || ''; if (m) { statusEl.classList.add('show'); setTimeout(function () { statusEl.classList.remove('show') }, 2200); } else statusEl.classList.remove('show'); }
      function sendToHost(msg) {
        log('Sending', msg);
        try { if (window.chrome && window.chrome.webview) { window.chrome.webview.postMessage(msg); return; } } catch (e) { }
        try { window.postMessage({ type: msg, trackId: trackId }, '*'); } catch (e) { }
      }
      function notifyVideoEnded() {
        if (endedSent) return;
        endedSent = true; stopPolling(); isPlaying = false;
        sendToHost('videoEnded');
        try { window.dispatchEvent(new CustomEvent('videoEnded', { detail: { trackId: trackId } })); } catch (e) { }
      }
      function showError(msg) {
        var wrap = document.getElementById('loadingWrap'); if (wrap) wrap.style.display = 'none';
        var err = document.createElement('div'); err.className = 'error';
        err.innerHTML = '<strong>' + (msg || 'Failed to load track') + '</strong><small>Check that trackId is valid.</small>';
        document.getElementById('content').appendChild(err);
      }
      function fmtTime(sec) {
        if (!isFinite(sec) || sec < 0) sec = 0;
        sec = Math.floor(sec);
        var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
        if (h) return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        return m + ':' + (s < 10 ? '0' : '') + s;
      }
      function ensureHint() { /* disabled */ return; }
      function _removeAnyHint() { try { document.querySelectorAll('.click-hint').forEach(function (el) { el.remove(); }); } catch (e) { } }
      try {
        new MutationObserver(function () { _removeAnyHint(); }).observe(document.documentElement, { childList: true, subtree: true });
        setInterval(_removeAnyHint, 800);
        document.addEventListener('DOMContentLoaded', _removeAnyHint);
      } catch (e) { }
      function getEmbedDoc() {
        var iframe = document.getElementById('spWidget');
        try { return iframe && iframe.contentDocument ? iframe.contentDocument : null; } catch (e) { return null; }
      }
      function getEmbedWindow() {
        var iframe = document.getElementById('spWidget');
        try { return iframe && iframe.contentWindow ? iframe.contentWindow : null; } catch (e) { return null; }
      }
      function _primeUserGesture() {
        if (userGesturePrimed) return;
        userGesturePrimed = true;
        try {
          ['pointerdown', 'mousedown', 'mouseup', 'click', 'touchstart', 'keydown'].forEach(function (t) {
            try { document.dispatchEvent(new MouseEvent(t, { bubbles: true, cancelable: true, view: window })); } catch (e) { try { document.dispatchEvent(new Event(t, { bubbles: true })); } catch (ee) { } }
          });
          var iframe = document.getElementById('spWidget');
          if (iframe) { try { iframe.focus(); } catch (e) { } try { iframe.dispatchEvent(new MouseEvent('click', { bubbles: true })); } catch (e2) { } }
        } catch (e) { }
      }
      function _tryPlayAllAudio(vol) {
        var played = 0;
        var targetVol = isFinite(vol) ? vol : pendingVolume;
        var docs = [];
        var d0 = getEmbedDoc();
        if (d0) docs.push(d0);
        try {
          if (d0) d0.querySelectorAll('iframe').forEach(function (f) { try { if (f.contentDocument) docs.push(f.contentDocument); } catch (e) { } });
        } catch (e) { }
        docs.forEach(function (doc) {
          try {
            doc.querySelectorAll('audio,video').forEach(function (a) {
              try {
                a.muted = false;
                a.volume = Math.max(0, Math.min(1, targetVol));
                var p = a.play();
                if (p && p.catch) p.catch(function (err) {
                  log('audio.play blocked, retry muted', err && err.message);
                  try { a.muted = true; var p2 = a.play(); if (p2 && p2.then) p2.then(function () { setTimeout(function () { try { a.muted = false; a.volume = targetVol; setEmbedVolume(targetVol); } catch (e) { } }, 650); }); } catch (e2) { }
                });
                played++;
              } catch (e) { }
            });
            try {
              ['pointerdown', 'mousedown', 'mouseup', 'click', 'touchstart'].forEach(function (t) {
                try { doc.dispatchEvent(new MouseEvent(t, { bubbles: true })); } catch (e) { }
              });
            } catch (e) { }
          } catch (e) { }
        });
        return played > 0;
      }
      function setEmbedVolume(vol) {
        if (!isFinite(vol)) return;
        if (vol > 1) vol /= 100;
        pendingVolume = Math.max(0, Math.min(1, vol));
        var doc = getEmbedDoc(), win = getEmbedWindow();
        if (doc) {
          try {
            doc.querySelectorAll('audio,video').forEach(function (a) { try { a.volume = pendingVolume; a.muted = false; } catch (e) { } });
            var inner = doc.querySelectorAll('iframe');
            inner.forEach(function (f) { try { var d = f.contentDocument; if (d) d.querySelectorAll('audio,video').forEach(function (a) { try { a.volume = pendingVolume; a.muted = false; } catch (e) { } }); } catch (e) { } });
          } catch (e) { }
        }
        if (win) {
          try {
            [{ command: 'setVolume', volume: pendingVolume }, { type: 'setVolume', volume: pendingVolume }, { command: 'setVolume', volume: pendingVolume * 100 }, { type: 'volume', volume: pendingVolume }].forEach(function (p) {
              try { win.postMessage(p, '*'); } catch (e) { }
            });
          } catch (e) { }
        }
        return true;
      }

      var _BAD_LABEL_RE = /save|simpan|saved|like|heart|add|follow|share|playlist/i;

      function _isBadButton(el) {
        try {
          var al = ((el.getAttribute('aria-label') || '') + ' ' + (el.getAttribute('title') || '') + ' ' + (el.textContent || '')).toLowerCase();
          return _BAD_LABEL_RE.test(al);
        } catch (e) { return false; }
      }

      function clickPlayInEmbed() {
        var doc = getEmbedDoc(), win = getEmbedWindow();
        var clicked = false;
        _primeUserGesture();
        _tryPlayAllAudio(pendingVolume);
        if (win) {
          try {
            [{ command: 'play' }, { type: 'play' }, { command: 'resume' }, { type: 'resume' }, { action: 'play' }, { event: 'play' }].forEach(function (c) { try { win.postMessage(c, '*'); win.postMessage(JSON.stringify(c), '*'); } catch (e) { } });
          } catch (e) { }
        }
        if (doc) {
          try {
            var selectors = [
              'button[data-testid="play-pause-button"]',
              'button[data-testid="play-button"]',
              'button[data-testid="control-button-play"]',
              '[data-testid="play-pause-button"]',
              '[data-testid="control-button-play"]',
              'button[aria-label="Play"]',
              'button[aria-label="Putar"]'
            ];
            for (var i = 0; i < selectors.length; i++) {
              try {
                var btn = doc.querySelector(selectors[i]);
                if (!btn || btn.disabled) continue;
                if (_isBadButton(btn)) { log('skip bad btn', selectors[i]); continue; }
                var label = (btn.getAttribute('aria-label') || btn.getAttribute('title') || '').toLowerCase();
                if (label.indexOf('pause') !== -1 || label.indexOf('jeda') !== -1) { clicked = true; break; }
                if (_BAD_LABEL_RE.test(label)) continue;
                try { btn.focus(); } catch (e) { }
                try { btn.dispatchEvent(new MouseEvent('pointerdown', { bubbles: true })); } catch (e) { }
                try { btn.dispatchEvent(new MouseEvent('mousedown', { bubbles: true })); } catch (e) { }
                btn.click();
                try { btn.dispatchEvent(new MouseEvent('mouseup', { bubbles: true })); } catch (e) { }
                log('Clicked PLAY', selectors[i]); clicked = true; break;
              } catch (e) { }
            }
            if (!clicked) {
              var allBtns = doc.querySelectorAll('button');
              for (var b = 0; b < allBtns.length; b++) {
                try {
                  var bx = allBtns[b];
                  if (bx.disabled) continue;
                  if (_isBadButton(bx)) continue;
                  var al = (bx.getAttribute('aria-label') || bx.getAttribute('title') || '').toLowerCase();
                  if ((al.indexOf('play') !== -1 || al.indexOf('putar') !== -1) && !_BAD_LABEL_RE.test(al)) {
                    if (al.indexOf('pause') !== -1 || al.indexOf('jeda') !== -1) { clicked = true; break; }
                    bx.click(); log('Clicked fallback PLAY #' + b + ' label=' + al); clicked = true; break;
                  }
                } catch (e) { }
              }
            }
            doc.querySelectorAll('iframe').forEach(function (f) {
              try {
                var d = f.contentDocument;
                if (!d) return;
                selectors.forEach(function (s) {
                  try {
                    var nb = d.querySelector(s);
                    if (nb && !nb.disabled && !_isBadButton(nb)) {
                      var nl = (nb.getAttribute('aria-label') || '').toLowerCase();
                      if (_BAD_LABEL_RE.test(nl)) return;
                      if (nl.indexOf('pause') !== -1) { clicked = true; return; }
                      nb.click(); clicked = true;
                    }
                  } catch (e) { }
                });
                d.querySelectorAll('audio,video').forEach(function (a) { try { a.muted = false; a.volume = pendingVolume; var pp = a.play(); if (pp && pp.catch) pp.catch(function () { a.muted = true; a.play(); }); } catch (e) { } });
              } catch (e) { }
            });
          } catch (e) { log('click err', e); }
        }
        if (clicked) return true;
        return !!win;
      }

      function isEmbedPlaying() {
        try {
          var doc = getEmbedDoc();
          if (doc) {
            var auds = doc.querySelectorAll('audio,video');
            for (var i = 0; i < auds.length; i++) { if (!auds[i].paused && !auds[i].ended && auds[i].currentTime > 0) return true; }
            if (doc.querySelector('button[aria-label="Pause"],[aria-label="Pause"],button[aria-label="Jeda"]')) return true;
          }
        } catch (e) { }
        if (embedLastDurationMs > 0 && embedLastPositionMs > 0 && !isPlaying) {
        }
        return isPlaying;
      }

      function clearAutoplay() { if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; } log('autoplay cleared tries=' + autoplayTries + ' isPlaying=' + isPlaying); }

      function startAutoplayLoop(reason) {
        if (autoplayTimer) clearInterval(autoplayTimer);
        autoplayTries = 0;
        _removeAnyHint();
        log('startAutoplayLoop reason=' + reason + ' embedReady=' + embedReady);

        // Cek apakah semua sudah siap sebelum autoplay
        if (!loadComplete) {
          log('Load not complete yet, waiting...');
          return;
        }

        function _tick() {
          if (endedSent) { clearAutoplay(); return; }
          if (isEmbedPlaying() || isPlaying) {
            try {
              var doc = getEmbedDoc();
              var trulyPlaying = false;
              if (doc) { doc.querySelectorAll('audio,video').forEach(function (a) { if (!a.paused && !a.ended) trulyPlaying = true; }); }
              if (trulyPlaying || isPlaying) { clearAutoplay(); return; }
            } catch (e) { clearAutoplay(); return; }
          }
          if (autoplayTries >= AUTOPLAY_MAX_TRIES) { log('autoplay max tries reached, give up but keep polling for videoEnded'); clearAutoplay(); return; }
          autoplayTries++;
          log('autoplay tick #' + autoplayTries + ' embedReady=' + embedReady + ' pendingPlay=' + pendingPlay);
          _primeUserGesture();
          setEmbedVolume(pendingVolume);
          clickPlayInEmbed();
          _tryPlayAllAudio(pendingVolume);
          try { var w = getEmbedWindow(); if (w) [{ command: 'play' }, { type: 'play' }].forEach(function (c) { w.postMessage(c, '*'); }); } catch (e) { }
          try { var ifr = document.getElementById('spWidget'); if (ifr) ifr.focus(); } catch (e) { }
          if (!isPlaying && autoplayTries >= 2) { isPlaying = true; trackStartedAt = Date.now(); endedSent = false; if (!pollingInterval) startPolling(); }
        }
        _tick();
        autoplayTimer = setInterval(_tick, 550);
        setTimeout(function () { if (autoplayTimer) { log('autoplay safety timeout clear'); clearAutoplay(); } }, 18000);
      }

      // Fungsi untuk mengecek semua kondisi siap dan memulai autoplay
      function checkAndStartPlay() {
        if (loadComplete) return;

        // Cek semua kondisi ready
        var allReady = readyFlags.artworkLoaded &&
          readyFlags.infoRendered &&
          readyFlags.embedLoaded &&
          readyFlags.trackDataLoaded;

        if (allReady) {
          log('All components loaded - starting autoplay');
          loadComplete = true;
          // Hilangkan loading
          var wrap = document.getElementById('loadingWrap');
          if (wrap) wrap.style.display = 'none';

          // Start autoplay
          setTimeout(function () {
            startAutoplayLoop('all-ready');
          }, 300);
        } else {
          log('Waiting for all components to load...', readyFlags);
        }
      }

      function render(track) {
        if (initialTrack) {
          if ((!track.durationMs || track.durationMs === 0) && initialTrack.durationMs) track.durationMs = initialTrack.durationMs;
          if (!track.duration || track.duration === '0:00') track.duration = initialTrack.duration;
          if (!track.thumbnail && initialTrack.thumbnail) track.thumbnail = initialTrack.thumbnail;
          if (!track.title && initialTrack.title) track.title = initialTrack.title;
          if (!track.artist && initialTrack.artist) track.artist = initialTrack.artist;
          if (!track.album && initialTrack.album) track.album = initialTrack.album;
        }
        metaTrack = track;
        if (track.durationMs && track.durationMs > 0) trackDurationMs = track.durationMs;
        document.title = (track.title || 'Spotify') + ' - ' + (track.artist || '');
        var wrap = document.getElementById('loadingWrap');
        if (wrap) wrap.style.display = 'none';

        var art = track.thumbnail || '';
        if (art) {
          document.getElementById('bg').style.backgroundImage = "url('" + art.replace(/'/g, "\\'") + "')";
          // Preload gambar untuk artwork
          var preloadImg = new Image();
          preloadImg.onload = function () {
            readyFlags.artworkLoaded = true;
            checkAndStartPlay();
          };
          preloadImg.onerror = function () {
            // Jika gagal load, tetap anggap siap
            readyFlags.artworkLoaded = true;
            checkAndStartPlay();
          };
          preloadImg.src = art;
        } else {
          readyFlags.artworkLoaded = true;
        }

        var content = document.getElementById('content');

        var artwork = document.createElement('div'); artwork.className = 'artwork'; artwork.id = 'artwork';
        var img = document.createElement('img'); img.alt = track.title || '';
        img.onload = function () {
          this.classList.add('loaded');
          readyFlags.artworkLoaded = true;
          checkAndStartPlay();
        };
        img.onerror = function () {
          readyFlags.artworkLoaded = true;
          checkAndStartPlay();
        };
        if (art) img.src = art;
        artwork.appendChild(img);
        content.appendChild(artwork);

        var info = document.createElement('div'); info.className = 'info'; info.id = 'info';
        info.innerHTML = '<h1>' + (track.title || 'Unknown') + '</h1><h2>' + (track.artist || '') + '</h2>';

        var durForStats = track.duration;
        if ((!durForStats || durForStats === '0:00') && initialTrack && initialTrack.duration) durForStats = initialTrack.duration;
        var stats = [];
        if (durForStats && durForStats !== '0:00') stats.push('&#9201; ' + durForStats);
        else if (trackDurationMs > 0) stats.push('&#9201; ' + fmtTime(trackDurationMs / 1000));
        if (track.album) stats.push(track.album);
        if (track.explicit) stats.push('Explicit');
        if (stats.length) info.innerHTML += '<div class="stats" id="statsRow">' + stats.map(function (s) { return '<span>' + s + '</span>' }).join('') + '</div>';
        content.appendChild(info);
        readyFlags.infoRendered = true;
        checkAndStartPlay();

        var player = document.createElement('div'); player.className = 'player'; player.id = 'player';
        var iframe = document.createElement('iframe');
        iframe.id = 'spWidget';
        iframe.setAttribute('allow', 'autoplay *; encrypted-media; fullscreen; clipboard-write; autoplay');
        iframe.setAttribute('allowFullscreen', '');
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('loading', 'eager');
        iframe.src = '/embed-proxy?trackId=' + encodeURIComponent(track.trackId || trackId) + credQs;
        player.appendChild(iframe);
        content.appendChild(player);

        log('Embed injected', iframe.src);
        embedReady = false; pendingPlay = false;
        _removeAnyHint();

        iframe.onload = function () {
          log('Embed loaded');
          embedReady = true;
          readyFlags.embedLoaded = true;
          _removeAnyHint();
          setTimeout(function () { setEmbedVolume(pendingVolume); }, 120);
          setTimeout(function () { setEmbedVolume(pendingVolume); }, 500);
          setTimeout(function () { setEmbedVolume(pendingVolume); }, 1200);
          setStatus('ready');
          sendToHost('embed_ready');

          // Tandai track data ready
          readyFlags.trackDataLoaded = true;
          checkAndStartPlay();

          if (pendingPlay) { pendingPlay = false; setTimeout(function () { startAutoplayLoop('pendingPlay'); }, 180); }
        };

        // Fallback jika onload tidak fire
        setTimeout(function () {
          if (!embedReady) {
            log('embed onload fallback check');
            var ifr = document.getElementById('spWidget');
            if (ifr) {
              try {
                embedReady = true;
                readyFlags.embedLoaded = true;
                readyFlags.trackDataLoaded = true;
                checkAndStartPlay();
                startAutoplayLoop('fallback-no-onload');
              } catch (e) { }
            }
          }
        }, 2200);
      }

      function doPlayEmbed(forceNoClear) {
        _removeAnyHint();
        _primeUserGesture();
        setEmbedVolume(pendingVolume);
        clickPlayInEmbed();
        _tryPlayAllAudio(pendingVolume);
        try { var ifr = document.getElementById('spWidget'); if (ifr) ifr.focus(); } catch (e) { }
        try { document.body.dispatchEvent(new MouseEvent('click', { bubbles: true })); } catch (e) { }
        isPlaying = true; trackStartedAt = Date.now(); endedSent = false;
        if (!forceNoClear && autoplayTimer) { /* biarkan autoplay loop yang clear sendiri saat trulyPlaying */ }
        startPolling();
        setStatus('playing');
        setTimeout(function () { setEmbedVolume(pendingVolume); _tryPlayAllAudio(pendingVolume); }, 320);
        setTimeout(function () { setEmbedVolume(pendingVolume); }, 900);
        setTimeout(function () {
          try {
            var tru = isEmbedPlaying();
            if (!tru) { clickPlayInEmbed(); _tryPlayAllAudio(pendingVolume); }
            else if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
          } catch (e) { }
        }, 1100);
      }

      function startPolling() {
        stopPolling();
        log('startPolling durationMs=' + trackDurationMs + ' embedDur=' + embedLastDurationMs);
        pollingInterval = setInterval(function () {
          if (!isPlaying || endedSent) return;
          var curDur = (trackDurationMs && trackDurationMs > 0 ? trackDurationMs : 0) || embedLastDurationMs || 180000;
          if (embedLastDurationMs > 0 && embedLastPositionMs >= 0) {
            var remain = embedLastDurationMs - embedLastPositionMs;
            if (remain <= 1000 && isPlaying) {
              log('embed position ' + embedLastPositionMs + '/' + embedLastDurationMs + ' near end -> videoEnded');
              stopPolling(); notifyVideoEnded(); return;
            }
            if (embedLastDurationMs > 0) return;
          }
          try {
            var doc = getEmbedDoc();
            if (doc) {
              var auds = doc.querySelectorAll('audio');
              for (var i = 0; i < auds.length; i++) {
                var a = auds[i];
                if (isFinite(a.duration) && a.duration > 0 && isFinite(a.currentTime)) {
                  var remA = (a.duration - a.currentTime) * 1000;
                  if (remA <= 700 && !a.paused && !a.ended) {
                    log('embed audio near end ' + a.currentTime + '/' + a.duration + ' -> videoEnded');
                    stopPolling(); notifyVideoEnded(); return;
                  }
                  if (a.duration * 1000 > 1000 && Math.abs(a.duration * 1000 - curDur) > 2000) {
                    trackDurationMs = Math.round(a.duration * 1000);
                    curDur = trackDurationMs;
                  }
                  return;
                }
              }
            }
          } catch (e) { }
          var elapsed = Date.now() - trackStartedAt;
          var threshold = curDur + 2000;
          if (elapsed >= threshold) {
            log('polling elapsed ' + elapsed + ' >= ' + threshold + ' -> videoEnded');
            stopPolling(); notifyVideoEnded();
          }
        }, 800);
        var curDur0 = (trackDurationMs && trackDurationMs > 0 ? trackDurationMs : 0) || embedLastDurationMs || 180000;
        var safetyMs = curDur0 + 30000;
        setTimeout(function () {
          if (!endedSent && isPlaying) {
            var elapsed = Date.now() - trackStartedAt;
            var effDur = (trackDurationMs && trackDurationMs > 0 ? trackDurationMs : 0) || embedLastDurationMs || curDur0;
            if (elapsed < effDur + 10000) return;
            log('hard safety trigger elapsed=' + elapsed + ' effDur=' + effDur);
            stopPolling(); notifyVideoEnded();
          }
        }, safetyMs);
      }

      function stopPolling() { if (pollingInterval) { clearInterval(pollingInterval); pollingInterval = null; } }

      function playSound() {
        log('[VB] playSound');
        endedSent = false;
        pendingVolume = pendingVolume || 0.9;
        setEmbedVolume(pendingVolume);
        _removeAnyHint();
        if (!embedReady) { pendingPlay = true; log('queue play until embedReady'); return; }
        doPlayEmbed();
        if (!autoplayTimer && !isEmbedPlaying()) {
          try {
            autoplayTries = 0;
            if (autoplayTimer) clearInterval(autoplayTimer);
            autoplayTimer = setInterval(function () {
              if (isEmbedPlaying() || endedSent) { clearInterval(autoplayTimer); autoplayTimer = null; return; }
              if (autoplayTries++ > 12) { clearInterval(autoplayTimer); autoplayTimer = null; return; }
              _primeUserGesture(); setEmbedVolume(pendingVolume); clickPlayInEmbed(); _tryPlayAllAudio(pendingVolume);
            }, 600);
          } catch (e) { }
        }
      }

      function pauseSound() {
        log('[VB] pauseSound');
        if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
        try {
          var doc = getEmbedDoc();
          if (doc) {
            var btn = doc.querySelector('button[aria-label="Pause"]') || doc.querySelector('[aria-label="Pause"]') || doc.querySelector('[aria-label="Jeda"]');
            if (btn) { btn.click(); }
            else { var w = getEmbedWindow(); if (w) w.postMessage({ command: 'pause' }, '*'); }
            doc.querySelectorAll('audio,video').forEach(function (a) { try { a.pause(); } catch (e) { } });
          } else { var w2 = getEmbedWindow(); if (w2) w2.postMessage({ command: 'pause' }, '*'); }
        } catch (e) { }
        isPlaying = false; stopPolling(); setStatus('paused');
      }

      function replaySound() {
        log('[VB] replaySound -> seek 0 + play');
        endedSent = false; isPlaying = false; trackStartedAt = Date.now();
        _removeAnyHint();
        var iframe = document.getElementById('spWidget');
        if (iframe) {
          try {
            var win = getEmbedWindow(), doc = getEmbedDoc();
            var seekOk = false;
            if (win) {
              try { win.postMessage({ command: 'seek', position: 0 }, '*'); win.postMessage({ command: 'seekTo', seconds: 0 }, '*'); win.postMessage({ type: 'seek', position: 0 }, '*'); seekOk = true; } catch (e) { }
            }
            if (doc) {
              try {
                doc.querySelectorAll('input[type="range"]').forEach(function (r) {
                  try { var max = parseFloat(r.max) || 100; if (max > 1) { r.value = '0'; r.dispatchEvent(new Event('input', { bubbles: true })); r.dispatchEvent(new Event('change', { bubbles: true })); seekOk = true; } } catch (e) { }
                });
              } catch (e) { }
            }
            if (seekOk) {
              setTimeout(function () { setEmbedVolume(pendingVolume); doPlayEmbed(true); _tryPlayAllAudio(pendingVolume); if (!isEmbedPlaying()) startAutoplayLoop('replaySeek'); }, 260);
              setTimeout(function () { if (!isEmbedPlaying() && !endedSent) { log('replaySeek fallback autoplay'); startAutoplayLoop('replayFallback'); } }, 900);
            } else {
              iframe.src = '/embed-proxy?trackId=' + encodeURIComponent(trackId) + credQs + '&t=' + Date.now();
              pendingPlay = true; isPlaying = false; embedReady = false; autoplayTries = 0;
              setTimeout(function () { if (!isPlaying && !endedSent && !autoplayTimer) { log('replayReload fallback autoplay'); startAutoplayLoop('replayReload'); } }, 1400);
            }
          } catch (e) { try { iframe.src = '/embed-proxy?trackId=' + encodeURIComponent(trackId) + credQs + '&t=' + Date.now(); pendingPlay = true; embedReady = false; } catch (ee) { } }
        } else { playSound(); }
      }

      function nextSound() { log('[VB] nextSound/nextVideo -> replay+autoplay'); try { sendToHost('nextRequested'); } catch (e) { } replaySound(); }

      document.getElementById('btnPlay').addEventListener('click', playSound);
      document.getElementById('btnPrev').addEventListener('click', pauseSound);
      document.getElementById('btnReplay').addEventListener('click', replaySound);
      document.getElementById('btnNext').addEventListener('click', nextSound);

      function handleEmbedMessage(data) {
        try {
          var t = data && (data.type || data.command) || '';
          var payload = (data && (data.payload || data.data)) || {};
          if (t === 'playback_update' || t === 'playback_started' || t === 'ready') {
            if (payload.isPaused != null) {
              var wasPlaying = isPlaying;
              isPlaying = !payload.isPaused;
              if (isPlaying) {
                _removeAnyHint();
                if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; log('autoplay cleared by playback_update isPlaying'); }
                if (!wasPlaying) {
                  var pos = payload.position != null ? payload.position : 0;
                  trackStartedAt = Date.now() - pos;
                  if (!pollingInterval) startPolling();
                }
              }
            } else if (payload.position != null && !payload.isPaused) {
              if (!isPlaying) {
                isPlaying = true; trackStartedAt = Date.now() - (payload.position || 0);
                if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
                if (!pollingInterval) startPolling();
              }
            }
            if (payload.position != null) embedLastPositionMs = payload.position;
            if (payload.duration != null && payload.duration > 0) {
              embedLastDurationMs = payload.duration;
              if (Math.abs(payload.duration - trackDurationMs) > 2000) {
                trackDurationMs = payload.duration;
                log('embed duration sync trackDurationMs=' + trackDurationMs);
              }
            }
            if (payload.position != null && payload.duration != null && payload.duration > 0 && (payload.duration - payload.position) <= 1200 && !payload.isPaused) {
              setTimeout(function () { if (!endedSent && isPlaying) { stopPolling(); notifyVideoEnded(); } }, 500);
            }
            if (t === 'ready' && payload.isPaused === false) {
              if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
            }
          } else if (t === 'ended' || t === 'track_ended' || t === 'playback_ended') {
            log('embed ended event'); notifyVideoEnded();
          }
        } catch (e) { }
      }

      window.addEventListener('message', function (e) {
        var d = e.data; if (!d) return;
        if (typeof d === 'object' && d !== null && (d.type === 'playback_update' || d.type === 'playback_started' || d.type === 'ready' || d.type === 'ended' || d.payload)) {
          handleEmbedMessage(d); return;
        }
        if (typeof d === 'string') {
          try { var pd = JSON.parse(d); if (pd && (pd.type === 'playback_update' || pd.payload)) { handleEmbedMessage(pd); return; } } catch (ee) { }
        }
      });

      function _normCmd(s) { try { return (s || '').toString().trim().toLowerCase(); } catch (e) { return ''; } }

      function handleHostCommand(data) {
        var cmd = null, payload = null;
        if (typeof data === 'string') {
          try { var p = JSON.parse(data); if (p && p.type) cmd = p.type; else if (p && p.command) cmd = p.command; else cmd = data; payload = p; } catch (e) { cmd = data; }
        } else if (data && typeof data === 'object') { cmd = data.type || data.command || data.action || data.message || data.cmd; payload = data; }
        if (payload && (payload.volume != null || payload.value != null)) {
          var v = parseFloat(payload.volume != null ? payload.volume : payload.value);
          if (isFinite(v)) { if (v > 1) v /= 100; pendingVolume = Math.max(0, Math.min(1, v)); setEmbedVolume(pendingVolume); if (_normCmd(cmd) === 'volume' || _normCmd(cmd) === 'setvolume') return; }
        }
        if (typeof cmd === 'string' && cmd.toLowerCase().indexOf('volume') !== -1) {
          var m = cmd.match(/([0-9]*\.?[0-9]+)/); if (m) { var v2 = parseFloat(m[1]); if (v2 > 1) v2 /= 100; if (isFinite(v2)) pendingVolume = v2; setEmbedVolume(v2); return; }
        }
        var ncmd = _normCmd(cmd);
        var ndata = _normCmd(data);
        if (ncmd === 'play' || ndata === 'play') { playSound(); return; }
        if (ncmd === 'pause' || ndata === 'pause') { pauseSound(); return; }
        if (ncmd === 'replay' || ncmd === 'repeat' || ncmd === 'restart' || ndata === 'replay' || ndata === 'repeat') { replaySound(); return; }
        if (ncmd === 'next' || ncmd === 'nextvideo' || ncmd === 'nextsound' || ncmd === 'skip' || ncmd === 'donext' || ncmd === 'nexttrack' || ndata === 'next' || ndata === 'nextvideo' || ndata === 'nextsound') { nextSound(); return; }
      }

      if (window.chrome && window.chrome.webview) {
        log('WebView2 bridge detected');
        try {
          window.chrome.webview.addEventListener('message', function (event) {
            var data = event.data;
            var nd = _normCmd(data);
            if (nd === 'pause') { pauseSound(); return; }
            if (nd === 'play') { playSound(); return; }
            if (nd === 'replay' || nd === 'repeat') { replaySound(); return; }
            if (nd === 'next' || nd === 'nextvideo' || nd === 'nextsound' || nd === 'skip' || nd === 'donext') { log('[VB] nextVideo alias -> nextSound'); nextSound(); return; }
            try {
              var parsed = null;
              if (typeof data === 'string') { try { parsed = JSON.parse(data); } catch (e) { } if (parsed && parsed.volume != null) { handleHostCommand(data); return; } }
              else if (data && (data.volume != null || data.value != null)) { handleHostCommand(data); return; }
            } catch (e) { }
            handleHostCommand(data);
          });
        } catch (e) { log('webview addEventListener err', e); }
      } else { log('WebView2 NOT detected'); }

      window.addEventListener('message', function (e) {
        var d = e.data; if (!d) return;
        if (typeof d === 'object' && (d.type === 'playback_update' || d.type === 'ready' || d.payload)) return;
        if (typeof d === 'string') {
          var nd2 = _normCmd(d);
          if (nd2 === 'pause' || nd2 === 'play' || nd2 === 'replay' || nd2 === 'repeat' || nd2 === 'next' || nd2 === 'nextvideo' || nd2 === 'nextsound' || nd2 === 'skip' || nd2 === 'donext') { handleHostCommand(d); return; }
          try { var p2 = JSON.parse(d); if (p2 && (p2.type === 'play' || p2.type === 'pause' || _normCmd(p2.type) === 'nextvideo')) { handleHostCommand(d); return; } } catch (e) { }
        }
        handleHostCommand(d);
      });

      if (!trackId) { showError('Missing trackId parameter'); }
      else if (!spDc) {
        showError('Missing sp_dc — room belum dikonfigurasi. Hubungi admin untuk isi sp_dc di DB room (1 kolom).');
      }
      else {
        if (initialTrack && initialTrack.title) {
          render({
            title: initialTrack.title || 'Unknown',
            artist: initialTrack.artist || '',
            thumbnail: initialTrack.thumbnail || '',
            duration: initialTrack.duration || '0:00',
            durationMs: initialTrack.durationMs || 0,
            album: initialTrack.album || null,
            explicit: false,
            trackId: trackId
          });
          // Tandai track data ready dari initialTrack
          readyFlags.trackDataLoaded = true;
          checkAndStartPlay();

          fetch('/track?trackId=' + encodeURIComponent(trackId) + credQs).then(function (r) { if (!r.ok) throw new Error('Track not found'); return r.json(); }).then(function (t) {
            metaTrack = t;
            if (t.durationMs && t.durationMs > 0) {
              trackDurationMs = t.durationMs;
              if (isPlaying && !endedSent && !pollingInterval) startPolling();
            }
            var art = t.thumbnail; if (art) { var img = document.querySelector('#artwork img'); if (img) img.src = art; document.getElementById('bg').style.backgroundImage = "url('" + art.replace(/'/g, "\\'") + "')"; }
            var h1 = document.querySelector('.info h1'); if (h1 && t.title) h1.textContent = t.title;
            var h2 = document.querySelector('.info h2'); if (h2 && t.artist) h2.textContent = t.artist;
            var statsEl = document.getElementById('statsRow') || document.querySelector('.info .stats');
            var durText = t.duration && t.duration !== '0:00' ? t.duration : (t.durationMs ? fmtTime(t.durationMs / 1000) : '');
            if (durText && statsEl) {
              if (statsEl.textContent.indexOf('⏱') !== -1) {
                statsEl.innerHTML = statsEl.innerHTML.replace(/⏱[^<]*/, '⏱ ' + durText);
              } else {
                var sp = document.createElement('span'); sp.innerHTML = '&#9201; ' + durText; statsEl.insertBefore(sp, statsEl.firstChild);
              }
            } else if (durText && !statsEl) {
              var infoEl = document.getElementById('info');
              if (infoEl) { var ns = document.createElement('div'); ns.className = 'stats'; ns.id = 'statsRow'; ns.innerHTML = '<span>&#9201; ' + durText + '</span>'; infoEl.appendChild(ns); }
            }
          }).catch(function () { });
        } else {
          fetch('/track?trackId=' + encodeURIComponent(trackId) + credQs).then(function (res) { if (!res.ok) throw new Error('Track not found (HTTP ' + res.status + ')'); return res.json(); }).then(function (trackData) {
            readyFlags.trackDataLoaded = true;
            render(trackData);
            checkAndStartPlay();
          }).catch(function (e) { showError(e.message); });
        }
      }
    })();
  </script>
