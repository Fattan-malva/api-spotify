<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotify Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg {
      position: fixed;
      inset: -80px;
      z-index: 0;
      background-size: cover;
      background-position: center;
      filter: blur(80px) brightness(.35) saturate(1.3);
      transform: scale(1.15);
      transition: background-image .6s ease;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, .15) 0%, rgba(0, 0, 0, .65) 100%);
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(1120px, calc(100% - 48px));
      height: min(500px, calc(100vh - 48px));
      display: grid;
      grid-template-columns: min(46vw, 500px) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) 166px;
      align-content: center;
      align-items: stretch;
      justify-content: center;
      column-gap: clamp(30px, 4vw, 64px);
      margin: auto;
    }

    .artwork {
      grid-column: 1;
      grid-row: 1 / span 2;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      justify-self: stretch;
      align-self: stretch;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .6);
      background: rgba(255, 255, 255, .06);
    }

    .artwork img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity .4s ease;
    }

    .artwork img.loaded {
      opacity: 1;
    }

    .info {
      grid-column: 2;
      grid-row: 1;
      text-align: left;
      width: 100%;
      min-width: 0;
      align-self: start;
      padding-top: 4px;
      overflow: hidden;
    }

    .info h1 {
      color: #fff;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 700;
      white-space: nowrap;
      display: inline-block;
      padding-left: 100%;
      animation: scrollText 12s linear infinite;
    }

    @keyframes scrollText {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-100%);
      }
    }

    .info h2 {
      color: rgba(255, 255, 255, .7);
      font-size: clamp(14px, 2vw, 18px);
      margin-top: 6px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .info .meta {
      color: rgba(255, 255, 255, .5);
      font-size: 13px;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .info .stats {
      color: rgba(255, 255, 255, .45);
      font-size: 13px;
      margin-top: 16px;
      display: flex;
      gap: 18px;
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    .player {
      grid-column: 2;
      grid-row: 2;
      width: 100%;
      height: 166px;
      max-width: none;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .5);
      align-self: end;
      background: rgba(0, 0, 0, .2);
    }

    .player iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #181818;
    }

    #audio {
      display: none;
    }

    #loadingWrap {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .15);
      border-top-color: #1db954;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading {
      color: rgba(255, 255, 255, .8);
      font-size: 14px;
      letter-spacing: .5px;
    }

    .error {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      color: #fff;
      font-size: 16px;
      text-align: center;
      max-width: 480px;
      padding: 20px;
    }

    .error small {
      display: block;
      margin-top: 10px;
      color: rgba(255, 255, 255, .5);
      font-size: 12px;
    }

    #status {
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 100;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, .7);
      color: rgba(255, 255, 255, .5);
      font-size: 10px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }

    .click-hint {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .65);
      color: #fff;
      cursor: pointer;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: .5px;
    }

    .click-hint .play-ico {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #1db954;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 12px 40px rgba(29, 185, 84, .5);
    }

    .click-hint .play-ico::after {
      content: "";
      display: block;
      width: 0;
      height: 0;
      border-left: 26px solid #fff;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      margin-left: 6px;
    }

    @media (max-width:760px) {
      body {
        overflow: auto;
      }

      .content {
        width: 100%;
        height: auto;
        min-height: 100%;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        align-content: center;
        justify-items: center;
        align-items: center;
        row-gap: 28px;
        padding: 24px 18px;
        overflow: auto;
      }

      .artwork {
        grid-column: 1;
        grid-row: 1;
        width: min(78vw, 360px);
        height: auto;
        aspect-ratio: 1;
        justify-self: center;
        align-self: auto;
      }

      .info {
        grid-column: 1;
        grid-row: 2;
        text-align: center;
        width: 100%;
        padding-top: 0;
        align-self: auto;
      }

      .info .stats {
        justify-content: center;
      }

      .player {
        grid-column: 1;
        grid-row: 3;
        width: 100%;
        height: 166px;
        align-self: auto;
      }
    }
  </style>
</head>

<body>

  <div class="bg" id="bg"></div>
  <div class="bg-overlay"></div>

  <div class="content" id="content">
    <div id="loadingWrap">
      <div class="spinner"></div>
      <div class="loading">Loading track...</div>
    </div>
  </div>

  <audio id="audio" preload="auto"></audio>
  <div id="status"></div>

  <script>
    (function () {
      "use strict";

      var params = new URLSearchParams(window.location.search);
      var trackId = params.get("trackId");

      var audio = document.getElementById("audio");
      var content = document.getElementById("content");
      var loadingWrap = document.getElementById("loadingWrap");
      var statusEl = document.getElementById("status");

      var usingAudio = false;
      var endedSent = false;
      var playerReady = false;
      var trackDurationMs = 0;
      var trackStartedAt = 0;
      var pollingInterval = null;
      var isPlaying = false;
      var hintEl = null;
      var hintShown = false;

      function log() {
        var args = Array.prototype.slice.call(arguments);
        args.unshift("[SP]");
        console.log.apply(console, args);
      }

      function setStatus(message) {
        if (statusEl) {
          statusEl.textContent = message || "";
        }
      }

      function sendToHost(message) {
        log("Sending message:", message);
        try {
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(message);
            log("WebView2 message sent:", message);
            return true;
          }
          log("WebView2 bridge not available");
        } catch (error) {
          console.error("[SP] WebView2 send error:", error);
        }

        try {
          window.postMessage({ type: message, trackId: trackId }, "*");
          log("Browser postMessage sent:", message);
        } catch (error) {
          console.error("[SP] Browser postMessage failed:", error);
        }

        return false;
      }

      function notifyVideoEnded() {
        if (endedSent) {
          console.log("[SP] videoEnded already processed");
          return;
        }
        endedSent = true;

        console.log("================================");
        console.log("[SP] videoEnded");
        console.log("[SP] Track ID:", trackId);
        console.log("[SP] Track finished");
        console.log("[SP] Sending videoEnded...");

        stopPolling();
        isPlaying = false;

        sendToHost("videoEnded");

        try {
          window.dispatchEvent(new CustomEvent("videoEnded", {
            detail: { trackId: trackId, event: "videoEnded" }
          }));
          console.log("[SP] Custom videoEnded event dispatched");
        } catch (error) {
          console.error("[SP] Custom event failed:", error);
        }

        console.log("[SP] videoEnded processing completed");
        console.log("================================");
      }

      function showError(message) {
        if (loadingWrap) {
          loadingWrap.style.display = "none";
        }

        var existing = document.querySelector(".error");
        if (existing) {
          existing.remove();
        }

        var err = document.createElement("div");
        err.className = "error";

        var strong = document.createElement("strong");
        strong.textContent = message || "Failed to load track";

        var small = document.createElement("small");
        small.textContent = "Check that the trackId is valid.";

        err.appendChild(strong);
        err.appendChild(small);
        document.body.appendChild(err);
      }

      function fmt(n) {
        if (n == null) return null;
        return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      }

      function ensureHint() {
        if (hintShown || hintEl) return;
        hintShown = true;
        hintEl = document.createElement("div");
        hintEl.className = "click-hint";
        hintEl.innerHTML = '<div class="play-ico"></div><div>Click to play</div>';
        hintEl.addEventListener("click", function () {
          playTrack();
          if (hintEl) {
            hintEl.remove();
            hintEl = null;
          }
        });
        document.body.appendChild(hintEl);
      }

      function render(track) {
        log("Track loaded:", track);

        endedSent = false;
        isPlaying = false;
        trackDurationMs = track.durationMs || 0;
        document.title = (track.title || "Spotify") + " - " + (track.artist || "");

        if (loadingWrap) {
          loadingWrap.style.display = "none";
        }

        var art = track.thumbnail || "";
        if (art) {
          document.getElementById("bg").style.backgroundImage = "url('" + art.replace(/'/g, "\\'") + "')";
        }

        var artwork = document.createElement("div");
        artwork.className = "artwork";

        var img = document.createElement("img");
        img.alt = track.title || "";
        img.onload = function () {
          this.classList.add("loaded");
        };
        if (art) {
          img.src = art;
        }
        artwork.appendChild(img);
        content.appendChild(artwork);

        var info = document.createElement("div");
        info.className = "info";

        var metaBits = [];
        if (track.album) metaBits.push(track.album);
        if (track.explicit) metaBits.push("Explicit");
        if (track.releaseDate) metaBits.push(track.releaseDate);

        var title = document.createElement("h1");
        title.textContent = track.title || "Unknown";

        var artist = document.createElement("h2");
        artist.textContent = track.artist || "";

        info.appendChild(title);
        info.appendChild(artist);

        if (metaBits.length) {
          var meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = metaBits.join(" · ");
          info.appendChild(meta);
        }

        var stats = [];
        if (track.duration) stats.push("⏱ " + track.duration);
        if (track.popularity != null) stats.push("🔥 " + track.popularity + " / 100");

        if (stats.length) {
          var statsEl = document.createElement("div");
          statsEl.className = "stats";
          stats.forEach(function (text) {
            var span = document.createElement("span");
            span.textContent = text;
            statsEl.appendChild(span);
          });
          info.appendChild(statsEl);
        }

        content.appendChild(info);

        var player = document.createElement("div");
        player.className = "player";
        content.appendChild(player);

        if (track.previewUrl && typeof track.previewUrl === "string") {
          setupAudioPlayer(track.previewUrl);
        } else {
          setupSpotifyEmbed(player, track.trackId);
        }
      }

      function setupAudioPlayer(source) {
        usingAudio = true;
        log("Using HTML5 Audio");
        log("Audio source:", source);

        audio.onended = null;
        audio.onerror = null;
        audio.onplay = null;
        audio.onpause = null;

        audio.src = source;
        audio.load();

        audio.onplay = function () {
          log("Audio PLAYING");
          isPlaying = true;
          setStatus("playing");
          trackStartedAt = Date.now();
          startPolling();
        };

        audio.onpause = function () {
          if (!audio.ended) {
            log("Audio PAUSED");
            isPlaying = false;
            setStatus("paused");
            stopPolling();
          }
        };

        audio.onerror = function (event) {
          console.error("[SP] Audio error:", event, audio.error);
          setStatus("audio-error");
        };

        audio.onended = function () {
          log("HTML5 AUDIO ENDED EVENT FIRED");
          isPlaying = false;
          setStatus("ended");
          stopPolling();
          notifyVideoEnded();
        };

        playAudio();
      }

      function playAudio() {
        if (!audio) {
          log("Audio element unavailable");
          return;
        }

        log("Attempting autoplay...");
        var promise = audio.play();

        if (promise && typeof promise.then === "function") {
          promise.then(function () {
            log("AUTOPLAY SUCCESS");
            isPlaying = true;
            setStatus("playing");
            trackStartedAt = Date.now();
            startPolling();
          }).catch(function (error) {
            console.warn("[SP] Autoplay blocked:", error);
            setStatus("autoplay-blocked");
            ensureHint();
          });
        }
      }

      function setupSpotifyEmbed(player, id) {
        usingAudio = false;
        log("Using Spotify Embed");

        var iframe = document.createElement("iframe");
        iframe.id = "spWidget";
        iframe.setAttribute("allow", "autoplay; encrypted-media");
        iframe.setAttribute("allowtransparency", "true");
        iframe.setAttribute("frameborder", "0");
        iframe.src = "https://open.spotify.com/embed/track/" + encodeURIComponent(id) +
          "?utm_source=generator&theme=0";

        player.appendChild(iframe);
        log("Spotify Embed created.");

        iframe.onload = function () {
          log("Spotify Embed loaded");
          playerReady = true;
          setStatus("embed_loaded");
          sendToHost("embed_ready");

          trackStartedAt = Date.now();
          isPlaying = true;

          setTimeout(function () {
            startPolling();
          }, 3000);

          setTimeout(function () {
            if (!isPlaying && !endedSent) {
              ensureHint();
            }
          }, 5000);
        };
      }

      function playTrack() {
        log("Play track triggered");

        if (usingAudio) {
          endedSent = false;
          playAudio();
          return;
        }

        var iframe = document.getElementById("spWidget");
        if (iframe) {
          try {
            iframe.src = iframe.src;
            log("Reloaded embed to play");
            isPlaying = true;
            trackStartedAt = Date.now();
            endedSent = false;
            startPolling();
            setStatus("playing");
          } catch (e) {
            console.error("[SP] Error reloading embed:", e);
          }
        }
      }

      function startPolling() {
        stopPolling();
        log("Starting polling for track end");

        if (trackDurationMs > 0) {
          var checkInterval = 1000;
          var elapsed = 0;

          pollingInterval = setInterval(function () {
            if (!isPlaying) {
              return;
            }

            elapsed = Date.now() - trackStartedAt;

            if (usingAudio && audio) {
              if (audio.ended) {
                log("Audio ended detected in polling");
                stopPolling();
                notifyVideoEnded();
                return;
              }
            }

            if (elapsed >= trackDurationMs - 500 && trackDurationMs > 0) {
              log("Track duration elapsed: " + elapsed + "ms >= " + trackDurationMs + "ms");
              log("TRACK ENDED DETECTED BY POLLING");
              stopPolling();
              isPlaying = false;
              notifyVideoEnded();
              return;
            }

            if (usingAudio && audio && audio.currentTime > 0) {
              setStatus("playing " + Math.floor(audio.currentTime) + "s / " + Math.floor(audio.duration) +
                "s");
            } else {
              var remaining = Math.max(0, Math.floor((trackDurationMs - elapsed) / 1000));
              setStatus("playing " + Math.floor(elapsed / 1000) + "s / " + Math.floor(trackDurationMs / 1000) +
                "s");
            }
          }, checkInterval);
        } else {
          log("Warning: No track duration available, using fallback detection");

          if (usingAudio) {
            pollingInterval = setInterval(function () {
              if (audio && audio.ended) {
                stopPolling();
                notifyVideoEnded();
                return;
              }
              if (audio && audio.currentTime > 0 && audio.currentTime >= audio.duration - 0.5) {
                stopPolling();
                notifyVideoEnded();
              }
            }, 500);
          } else {
            pollingInterval = setInterval(function () {
              if (!isPlaying) return;
              var elapsed = Date.now() - trackStartedAt;
              if (elapsed > 180000) {
                log("Fallback timeout reached (3 minutes)");
                stopPolling();
                isPlaying = false;
                notifyVideoEnded();
              }
            }, 5000);
          }
        }

        var safetyTimeout = Math.max(trackDurationMs || 180000, 180000) + 10000;
        setTimeout(function () {
          if (pollingInterval && !endedSent) {
            log("Safety timeout reached - sending end");
            stopPolling();
            if (!endedSent) {
              notifyVideoEnded();
            }
          }
        }, safetyTimeout);
      }

      function stopPolling() {
        if (pollingInterval) {
          clearInterval(pollingInterval);
          pollingInterval = null;
          log("Polling stopped");
        }
      }

      function handleHostCommand(data) {
        log("Host command:", data);

        if (data === "play") {
          endedSent = false;
          if (usingAudio) {
            playAudio();
          } else {
            playTrack();
          }
          return;
        }

        if (data === "pause") {
          if (usingAudio) {
            audio.pause();
          } else {
            var iframe = document.getElementById("spWidget");
            if (iframe) {
              try {
                var currentSrc = iframe.src;
                iframe.src = "";
                iframe.src = currentSrc;
                isPlaying = false;
                stopPolling();
                setStatus("paused");
                log("Embed paused (reloaded)");
              } catch (e) {
                console.error("[SP] Error pausing embed:", e);
              }
            }
          }
          return;
        }

        if (data === "replay" || data === "next") {
          endedSent = false;
          if (usingAudio) {
            try {
              audio.currentTime = 0;
            } catch (e) { }
            playAudio();
          } else {
            playTrack();
          }
          return;
        }
      }

      if (window.chrome && window.chrome.webview) {
        log("WebView2 bridge detected.");
        window.chrome.webview.addEventListener("message", function (event) {
          handleHostCommand(event.data);
        });
      } else {
        log("WebView2 bridge NOT detected.");
      }

      function loadTrack() {
        if (!trackId) {
          showError("Missing trackId parameter");
          return;
        }

        log("Loading track:", trackId);
        setStatus("loading");

        fetch("/track?trackId=" + encodeURIComponent(trackId))
          .then(function (res) {
            if (!res.ok) {
              throw new Error("Track not found (HTTP " + res.status + ")");
            }
            return res.json();
          })
          .then(function (track) {
            log("Track API response:", track);
            render(track);
          })
          .catch(function (error) {
            console.error("[SP] Load error:", error);
            showError(error.message || "Failed to load track");
          });
      }

      window.addEventListener("beforeunload", function () {
        stopPolling();
      });

      loadTrack();
    })();
  </script>

</body>

</html>
